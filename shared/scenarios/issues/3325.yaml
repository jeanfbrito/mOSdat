name: "Rocket.Chat Desktop — Telephony deeplink / protocol handler test"
# Validates PR https://github.com/RocketChat/Rocket.Chat.Electron/pull/3325:
#   - `tel:` / `callto:` protocol handlers registered in electron-builder.json
#   - IPC channel `telephony/call-requested` exposed via preload
#   - Protocol handlers don't crash the app
#   - OS desktop entry includes MimeType registration
#   - Servers.json loads correctly (server selection screen appears)
#   - Settings window shortcut works (Ctrl+,)
#
# The app is NOT logged in — we're testing that the framework
# (protocol registration, IPC transport, server selection UI) survives
# dispatch, not end-to-end dialing.
#
# New commits since initial scenario:
#   - 9d0a4d30f: Fuselage modal replaces native dialog for server selection
#   - 6ddda80cc: i18n translations for telephony modal
#   - c83728f10: Settings > TelephonyServer dropdown (hidden when ≤1 server)
#   - ab816c0db: Dialog attaches to root window, guards duplicate IPC listener

steps:
  # ── Pre-test cleanup ──────────────────────────────────────────────────────
  - shell: |
      pkill -9 -x rocketchat-desktop.bin 2>/dev/null || true
      for i in 1 2 3 4 5; do
        sleep 1
        pgrep -x rocketchat-desktop.bin >/dev/null || break
        pkill -9 -x rocketchat-desktop.bin 2>/dev/null || true
      done

      # Wipe config dirs so servers.json takes effect fresh
      rm -rf /home/jean/.config/Rocket.Chat/
      rm -rf /home/jean/.config/Rocket.Chat\\ \\(development\\)/
      rm -f /home/jean/.config/Rocket.Chat/servers.json
      rm -rf /home/jean/.config/Rocket.Chat/logs/
      rm -f /home/jean/.config/Rocket.Chat/servers.json
      sleep 1
      echo CLEANUP_DONE

  # ── Write servers.json into the production userData dir ──────────────────
  # The DEB installs to /opt/Rocket.Chat/ (production), so app.getPath('userData')
  # resolves to ~/.config/Rocket.Chat/ (NOT the "(development)" suffix).
  # It DELETES the file after reading (one-time migration to serversMap).
  - shell: |
      mkdir -p "/home/jean/.config/Rocket.Chat"
      cat > "/home/jean/.config/Rocket.Chat/servers.json" << 'EOF'
      {
        "Workspace": "https://rocketchat.jeanbrito.com",
        "Mobile RC": "https://mobile.rocket.chat"
      }
      EOF
      ls -la "/home/jean/.config/Rocket.Chat/servers.json"
      echo SERVERS_JSON_WRITTEN

  # ── Launch app clean ─────────────────────────────────────────────────────
  - shell: |
      export DISPLAY=:0
      nohup /opt/Rocket.Chat/rocketchat-desktop --no-sandbox > /dev/null 2>&1 &
      echo APP_LAUNCHED

  - wait: 10

  - verify: "The Rocket.Chat application window shows a server selection screen listing at least two server entries — 'Workspace' and 'Mobile RC'. Look for server name labels, buttons, or cards with these names. This is NOT the 'Add a server' empty screen with only an input field asking for a server URL. The user should see server options to click on"
    verify_timeout: 20

  # ── Tel protocol handler ─────────────────────────────────────────────────
  # With 2+ servers, dispatch triggers the Fuselage server selection modal
  # (introduced in 9d0a4d30f). Not testing modal visual — just crash/no-crash.
  - shell: |
      xdg-open "tel:+5511999999999"
      echo TEL_DISPATCHED

  - wait: 6

  - verify: "the Rocket.Chat application window is still visible and responsive — no crash dialog, no frozen window, no desktop environment crash handler. The app process should be alive"
    verify_timeout: 10

  # ── Re-launch fresh ──────────────────────────────────────────────────────
  # (servers.json was deleted by loadUserServers, so second launch shows
  #  standard add-server screen — this is expected behavior)
  - shell: |
      pkill -9 -x rocketchat-desktop.bin 2>/dev/null || true
      sleep 2
      echo KILLED

  - shell: |
      export DISPLAY=:0
      nohup /opt/Rocket.Chat/rocketchat-desktop --no-sandbox > /dev/null 2>&1 &
      echo APP_LAUNCHED

  - wait: 10

  - verify: "a Rocket.Chat application window is visible on screen — the standard add-server screen with input field and Rocket.Chat logo"
    verify_timeout: 10

  # ── Callto protocol handler ──────────────────────────────────────────────
  - shell: |
      xdg-open "callto:+5511999999999"
      echo CALLTO_DISPATCHED

  - wait: 6

  - verify: "the Rocket.Chat application window is still visible and responsive — no crash dialog, no frozen window"
    verify_timeout: 10

  # ── Verify desktop entry includes MimeType for tel:/callto: ───────────
  # Shell exit code check — no VLM since we're checking text output, not GUI
  - shell: |
      ENTRY=$(cat /usr/share/applications/rocketchat-desktop.desktop 2>/dev/null | grep -c "x-scheme-handler/tel")
      ENTRY2=$(cat /usr/share/applications/rocketchat-desktop.desktop 2>/dev/null | grep -c "x-scheme-handler/callto")
      if [ "$ENTRY" -gt 0 ] && [ "$ENTRY2" -gt 0 ]; then
        echo "MIMETYPE_OK: tel and callto found in desktop entry"
        exit 0
      else
        echo "MIMETYPE_FAIL: tel=$ENTRY callto=$ENTRY2"
        exit 1
      fi

  # ── Verify Settings shortcut doesn't crash (Ctrl+,) ──────────────────────
  - shell: |
      export DISPLAY=:0
      nohup /opt/Rocket.Chat/rocketchat-desktop --no-sandbox > /dev/null 2>&1 &
      echo APP_LAUNCHED

  - wait: 10

  - shell: |
      xdotool key ctrl+comma
      echo CTRL_COMMA_SENT

  - wait: 5

  - verify: "the Rocket.Chat application window is still visible and responsive — no crash dialog, frozen window, or error message. The Settings panel may have opened inside the main window (not a separate native window), but the main app window should remain stable"
    verify_timeout: 10

  # ── Kill app ─────────────────────────────────────────────────────────────
  - shell: |
      pkill -9 -x rocketchat-desktop.bin 2>/dev/null || true
      echo CLEANUP_DONE
