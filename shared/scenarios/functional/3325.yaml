name: "Rocket.Chat Desktop — Telephony deeplink / protocol handler test"
# Validates PR https://github.com/RocketChat/Rocket.Chat.Electron/pull/3325:
#   - `tel:` / `callto:` protocol handlers registered in electron-builder.json
#   - IPC channel `telephony/call-requested` exposed via preload
#   - Protocol handlers don't crash the app
#   - Servers.json loads correctly (server selection screen appears)
#   - Settings window shortcut works (Ctrl+,)
#
# The app is NOT logged in — we're testing that the framework
# (protocol registration, IPC transport, server selection UI) survives
# dispatch, not end-to-end dialing.

steps:
  # ── Pre-test cleanup ──────────────────────────────────────────────────────
  - shell: |
      pkill -9 -x rocketchat-desktop.bin 2>/dev/null || true
      for i in 1 2 3 4 5; do
        sleep 1
        pgrep -x rocketchat-desktop.bin >/dev/null || break
        pkill -9 -x rocketchat-desktop.bin 2>/dev/null || true
      done

      # Wipe config dirs so servers.json takes effect fresh
      rm -rf /home/jean/.config/Rocket.Chat\ \(development\)/
      rm -rf /home/jean/.config/Rocket.Chat/logs/
      rm -f /home/jean/.config/Rocket.Chat/servers.json
      sleep 1
      echo CLEANUP_DONE

  # ── Write servers.json into (development) dir ─────────────────────────────
  # loadUserServers() reads from app.getPath('userData') which on the dev
  # build resolves to ~/.config/Rocket.Chat (development)/servers.json
  # It DELETES the file after reading (one-time migration).
  - shell: |
      mkdir -p "/home/jean/.config/Rocket.Chat (development)"
      cat > "/home/jean/.config/Rocket.Chat (development)/servers.json" << 'EOF'
      {
        "Workspace": "https://rocketchat.jeanbrito.com",
        "Mobile RC": "https://mobile.rocket.chat"
      }
      EOF
      ls -la "/home/jean/.config/Rocket.Chat (development)/servers.json"
      echo SERVERS_JSON_WRITTEN

  # ── Launch app clean ─────────────────────────────────────────────────────
  - shell: |
      export DISPLAY=:0
      nohup /opt/Rocket.Chat/rocketchat-desktop --no-sandbox > /dev/null 2>&1 &
      echo APP_LAUNCHED

  - wait: 10

  - verify: "The Rocket.Chat application window shows a server selection screen listing at least two servers — 'Workspace' and 'Mobile RC'. This is NOT the 'Add a server' empty screen. Look for server name labels, buttons, or cards that show configured servers. The key: the user should see server options to click on, not just an empty input field asking for a server URL"
    verify_timeout: 20

  # ── Tel protocol handler ─────────────────────────────────────────────────
  - shell: |
      xdg-open "tel:+5511999999999"
      echo TEL_DISPATCHED

  - wait: 6

  - verify: "the Rocket.Chat application window is still visible and responsive — no crash dialog, no frozen window, no desktop environment crash handler. The app process should be alive and the window interactive"
    verify_timeout: 10

  # ── Re-launch fresh ──────────────────────────────────────────────────────
  # (servers.json was deleted by loadUserServers, so second launch shows
  #  standard add-server screen — this is expected behavior)
  - shell: |
      pkill -9 -x rocketchat-desktop.bin 2>/dev/null || true
      sleep 2
      echo KILLED

  - shell: |
      export DISPLAY=:0
      nohup /opt/Rocket.Chat/rocketchat-desktop --no-sandbox > /dev/null 2>&1 &
      echo APP_LAUNCHED

  - wait: 10

  - verify: "a Rocket.Chat application window is visible on screen"
    verify_timeout: 10

  # ── Callto protocol handler ──────────────────────────────────────────────
  - shell: |
      xdg-open "callto:+5511999999999"
      echo CALLTO_DISPATCHED

  - wait: 6

  - verify: "the Rocket.Chat application window is still visible and responsive — no crash dialog, no frozen window"
    verify_timeout: 10

  # ── Verify Settings shortcut doesn't crash (Ctrl+,) ──────────────────────
  - shell: |
      xdotool key ctrl+comma
      echo CTRL_COMMA_SENT

  - wait: 5

  - verify: "the Rocket.Chat application window is still visible and responsive — no crash dialog, frozen window, or error message. The Settings window may have opened as a separate native window (not visible via VNC), but the main app window should remain stable"
    verify_timeout: 10

  # ── Kill app ─────────────────────────────────────────────────────────────
  - shell: |
      pkill -9 -x rocketchat-desktop.bin 2>/dev/null || true
      echo CLEANUP_DONE
