name: "Rocket.Chat smoke test (Linux)"
# Linux port of rocketchat-smoke.yaml. Instead of spawning Rocket.Chat over
# SSH (which fails on Wayland because an SSH shell has no DISPLAY /
# WAYLAND_DISPLAY / xauth), the VLM drives the desktop launcher the same way
# a human would:
#
#     Escape → (close any overlay / popup)
#     Super  → (open Activities / Kickoff / whisker menu)
#     type "Rocket"
#     Enter  → (launch highlighted app)
#
# Works unchanged across GNOME Wayland, GNOME X11, KDE, XFCE — every major
# Linux DE binds Super to its launcher and launches on Enter.

steps:
  # ── Pre-test cleanup: clean-slate Rocket.Chat, dismiss stale dialogs ────
  - shell: |
      # IMPORTANT: every pkill/pgrep below uses `-x` (exact process name).
      # Do NOT use `-f` (cmdline regex) — the bash script body contains the
      # literal strings "rocketchat-desktop", "update-manager", etc., so
      # `pkill -f <those>` matches its own /proc/<pid>/cmdline and SIGKILLs
      # the script after one command. See git log: 780481f, 3d705e4.
      #
      # Stage 1: kill RC + helper popups, hard-kill any zygote/renderer/GPU
      # children. Loop until pgrep returns nothing or we've waited 8s.
      pkill -9 -x rocketchat-desktop.bin 2>/dev/null || true
      pkill -x update-manager 2>/dev/null || true
      pkill -x update-notifier 2>/dev/null || true
      for i in 1 2 3 4 5 6 7 8; do
        sleep 1
        pgrep -x rocketchat-desktop.bin >/dev/null || break
        pkill -9 -x rocketchat-desktop.bin 2>/dev/null || true
      done
      # Stage 2: nuke keyring daemon FIRST so it can't write back stored tokens
      # while we delete files. RC stores login tokens in libsecret via keytar;
      # a userData wipe alone leaves the session intact. Daemon will respawn
      # empty on next desktop login or libsecret access.
      pkill -9 gnome-keyring-d 2>/dev/null || true
      sleep 1
      # Delete ALL keyring files — including 'default' (no .keyring extension).
      rm -f "$HOME"/.local/share/keyrings/*.keyring
      rm -f "$HOME"/.local/share/keyrings/default
      rm -f "$HOME"/.local/share/keyrings/login.keyring
      rm -rf "$HOME"/.cache/keyring-* 2>/dev/null || true
      # Stage 3: nuke Electron userData — release, dev build, Electron suffix.
      rm -rf "$HOME/.config/Rocket.Chat"
      rm -rf "$HOME/.config/Rocket.Chat (development)"
      rm -rf "$HOME/.config/Rocket.Chat Electron"
      # Snap confines its own userData under ~/snap/rocketchat-desktop/<rev>/.config/;
      # GNOME's launcher prefers the snap over the deb when both installed.
      for d in "$HOME"/snap/rocketchat-desktop/*/.config/"Rocket.Chat"*; do
        [ -e "$d" ] && rm -rf "$d"
      done
      # Stage 4: Chromium cache + alt-share-path caches. NOTE: We deliberately
      # do NOT wipe ~/.local/share/Rocket.Chat — that holds the Meteor
      # IndexedDB / message cache. Wiping it forces a full workspace re-sync
      # on every smoke run; on a large workspace this stalls the chat pane
      # on skeleton placeholders for minutes. Auth is wiped via .config +
      # libsecret keyring above, so logout is still enforced.
      rm -rf "$HOME/.cache/Rocket.Chat" 2>/dev/null || true
      rm -rf "$HOME/.cache/Rocket.Chat (development)" 2>/dev/null || true
      rm -rf "$HOME/.cache/Rocket.Chat Electron" 2>/dev/null || true
      # Stage 5: confirm clean. Fail loudly if anything survived so the test
      # halts here instead of running on a half-stale session.
      remaining=$(ls -d "$HOME"/.config/Rocket.Chat* 2>/dev/null | head -1)
      if [ -n "$remaining" ]; then
        echo "cleanup:FAILED — $remaining survived"
        exit 1
      fi
      echo cleanup:ok

  # Reset desktop to a known state — Escape collapses any leftover overview
  # or menu from a previous run.
  - key: "escape"
    wait: 1

  # Launch Rocket.Chat. The Linux branch of `injector.launch` runs the
  # binary with env inherited from the user's graphical session
  # (gnome-shell / plasmashell / xfce4-session), so Electron picks up
  # DISPLAY / XAUTHORITY / WAYLAND_DISPLAY / DBUS from the active session
  # and doesn't die with "Missing X server" as it would from a plain SSH
  # shell.
  - launch: "{app_path} --no-sandbox"
    wait: 30
    # F4: explicit window name so VLM question uses natural language ("Rocket.Chat")
    # instead of the raw binary basename ("rocketchat-desktop" with hyphens).
    # wait=30: Electron + RC takes 5-15s post-spawn to paint the splash, then
    # several more seconds for the server-URL form. First VLM verify call must
    # land AFTER UI draws.
    launch_window: "Rocket.Chat"
    # Strict verify: RC must be on the first-launch "Enter your server URL" screen.
    # This catches stale session state that cleanup missed — otherwise the
    # next step will happily type the server URL as a chat message into the
    # composer of a previously-logged-in workspace.
    verify: "the Rocket.Chat window is open and an input field labeled 'Enter your server URL' is visible under the rocket.chat logo"
    verify_not: "an Email/username input field, a Password input field, a chat history containing messages, a 'Message #...' composer, or a window title containing 'unread message' or a workspace name like 'Southlogic' is visible inside the Rocket.Chat window"
    verify_timeout: 20
    retries: 2

  # ── Dismiss RC's electron-updater "update available" dialog if it appears.
  #    The modal floats over the login screen and obscures the server URL input.
  #    VLM checks visibility first; skips silently if no dialog is present.
  - if_visible: "button with visible text 'Later', 'Dismiss', or 'Not now', OR an X close icon in the top-right corner of an update notification banner or dialog"
    then:
      - localize: "button with visible text 'Later', 'Dismiss', or 'Not now', OR an X close icon in the top-right corner of an update notification banner or dialog"

  # ── Rest is identical to the Windows smoke. All clicks/types flow through
  #    VNC and the VLM, so they're OS-agnostic. ──────────────────────────
  - localize: "the Enter your server URL input text field below the rocket.chat logo"
    verify_click: "the 'Enter your server URL' input text field is focused — a text cursor is visible inside it OR a blue/coloured focus ring is visible around the box"
    verify_click_diff: true
    canary: true
    canary_verify: "the character 'q' is visible as plain text inside the 'Enter your server URL' input text field below the rocket.chat logo, NOT inside any other field, dialog, or window"
    then_type: "{workspace_url}"
    then_key: "enter"
    verify: "a form with both an Email or username input field AND a labeled Password input field is visible — this is the login page (not the server URL page)"
    verify_not: "the 'Enter your server URL' input field is still visible on screen, OR an error / offline / connection-failure banner is shown"
    verify_timeout: 25
    retries: 3

  - localize: "the upper input field labeled 'Email or username' (above the Password field)"
    verify_click: "the upper Email or username input field is focused — a text cursor or focus ring is visible inside that specific row, NOT inside the Password field below"
    verify_click_diff: true
    canary: true
    canary_verify: "the character 'q' is visible as plain text inside the upper Email or username input field, NOT inside the Password field below it and NOT anywhere else"
    then_type: "{test_user}"
    # Note: A4 precheck_click NOT used here — verify_input below already
    # catches mis-click (typed text must appear in the username field, and
    # password field must stay empty). A4's narrow crop also tends to
    # false-reject valid clicks because the field "Email or username"
    # label sits OUTSIDE the input box.
    verify_input: "the Email or username field contains the text 'jean' (visible as plain text, not dots), and the Password field below it is still empty"
    retries: 3

  - localize: "the Password input row — find the small eye icon (an open/closed eye glyph used to toggle password visibility) on the right edge of an input row, and click the empty space INSIDE that input row to its LEFT (the masked text area, roughly 50-150px left of the eye icon). The Email/username field above has NO eye icon — never click there. The Forgot password link is plain blue underlined text with no input box — never click there."
    verify_click: "the Password input row (the row with the eye icon on its right edge) is focused — a text cursor or focus ring is visible inside that specific row, NOT inside the Email/username row above"
    verify_click_diff: true
    then_type: "{test_password}"
    # verify_input gates the Enter key on the typed text actually landing in
    # the Password field (not leaking into Email). If VLM clicked the wrong
    # row, password text appended to the Email value 'jean' — this check
    # catches that and triggers retry on a fresh re-localize.
    verify_input: "the Email or username field at top still shows ONLY the four letters 'jean' as plain text with no other characters appended, AND the Password row directly below it shows a row of masked dots indicating a typed password is present"
    then_key: "enter"
    verify: "a left-side channel sidebar and a main chat area are visible, and no Password input field is on screen"
    verify_not: "a Password input field, an Email/username field, or an error like 'user not found' / 'invalid password' / 'offline' is visible"
    verify_timeout: 30
    retries: 3

  - localize: "the General channel in the left sidebar"
    # Channel content can render slowly OR be empty (no messages yet) — both
    # are valid post-login states. Verify any sign of an interactive chat
    # pane (messages, empty-state placeholder, or composer), and reject only
    # the explicit broken state where ONLY skeleton bars are visible.
    wait: 5
    verify: "the chat pane on the right shows either real messages with sender names, OR an empty-state placeholder such as 'No messages yet' or 'Welcome', OR a message composer / 'Message #general' input field at the bottom — i.e., the channel UI is interactive"
    verify_not: "the chat pane shows ONLY grey skeleton placeholder bars or shimmer animation with no message text, no empty-state text, and no composer rendered"
    verify_timeout: 240
    retries: 5

  - localize: "the message input box or composer at the bottom of the chat"
    then_type: "mosdat functional test {timestamp}"
    then_key: "enter"
    wait: 3
    verify: "the chat shows a recently-typed message OR the typed text 'mosdat functional test' is visible anywhere on screen"
    verify_not: "the message composer still shows 'mosdat functional test' as unsent, or an error is visible"
    verify_timeout: 30
    retries: 5
