name: "Rocket.Chat Desktop — Telephony deeplink / protocol handler test"
# Validates PR https://github.com/RocketChat/Rocket.Chat.Electron/pull/3325:
#   - `tel:` / `callto:` protocol handlers registered in electron-builder.json
#   - IPC channel `telephony/call-requested` exposed via preload
#   - Protocol handlers don't crash the app
#   - OS desktop entry includes MimeType registration
#   - Servers.json loads correctly (server selection screen appears)
#   - Settings window shortcut works (Ctrl+,)
#
# The app is NOT logged in — we're testing that the framework
# (protocol registration, IPC transport, server selection UI) survives
# dispatch, not end-to-end dialing.
#
# New commits since initial scenario:
#   - 9d0a4d30f: Fuselage modal replaces native dialog for server selection
#   - 6ddda80cc: i18n translations for telephony modal
#   - c83728f10: Settings > TelephonyServer dropdown (hidden when ≤1 server)
#   - ab816c0db: Dialog attaches to root window, guards duplicate IPC listener

steps:
  # ── Pre-test cleanup ──────────────────────────────────────────────────────
  - shell: |
      # Kill ALL RC instances AND persistent apport crash dialog
      # apport-gtk persists across launches and tricks VLM into seeing crash
      pkill -9 -f rocketchat-desktop.bin 2>/dev/null || true
      pkill -9 rocketchat-desktop.bin 2>/dev/null || true
      for i in 1 2 3 4 5; do
        sleep 1
        pgrep -f rocketchat-desktop.bin >/dev/null || break
        pkill -9 -f rocketchat-desktop.bin 2>/dev/null || true
      done

      # Kill the persistent apport crash dialog (apport-gtk stays alive)
      # This dialog caused false-positive VLM failures in ALL prior test runs
      pkill -9 -x apport-gtk 2>/dev/null || true
      pkill -9 -f "apport.*rocketchat" 2>/dev/null || true

      # Wipe config dirs so servers.json takes effect fresh
      rm -rf "/home/jean/.config/Rocket.Chat (development)"/
      rm -rf /home/jean/.config/Rocket.Chat/logs/
      rm -f "/home/jean/.config/Rocket.Chat (development)/servers.json"
      sleep 1
      echo CLEANUP_DONE

  # ── Write servers.json into the (development) dir ─────────────────────────
  # Even when packaged as DEB, the app appends " (development)" to userData,
  # so servers.json goes to ~/.config/Rocket.Chat (development)/servers.json
  # It DELETES the file after reading (one-time migration to serversMap).
  - shell: |
      mkdir -p "/home/jean/.config/Rocket.Chat (development)"
      cat > "/home/jean/.config/Rocket.Chat (development)/servers.json" << 'EOF'
      {
        "Workspace": "https://rocketchat.jeanbrito.com",
        "Mobile RC": "https://mobile.rocket.chat"
      }
      EOF
      ls -la "/home/jean/.config/Rocket.Chat (development)/servers.json"
      echo SERVERS_JSON_WRITTEN

  # ── Launch app clean ─────────────────────────────────────────────────────
  # wrapper.sh (PR 3325) forces --ozone-platform=wayland when it detects a
  # Wayland socket. Via SSH, XDG_SESSION_TYPE is "tty" and WAYLAND_DISPLAY
  # is unset — but user env has real Wayland socket (gnome-shell runs on
  # QEMU virtio-gpu). The wrapper passes through to Wayland.
  #
  # Problem: QEMU virtual GPU (driver null, pci 1234:1111) does NOT support
  # Wayland rendering. Without GPU, the compositor can't paint the window.
  #
  # Fix: bypass the wrapper's Wayland detection by explicitly passing
  # --disable-gpu --ozone-platform=x11. Electron takes the last occurrence,
  # so user args win over wrapper's EXTRA_ARGS.
  #
  # This avoids:
  #   - Wayland GPU crash → apport dialog (VLM false positive)
  #   - Wayland software rendering → invisible window (no GPU compositor)
  #   - Infinite gpu-info-update relaunch loop (now guarded in app.ts)
  #
  # Note: app.ts also has a production fix for real users (X11 relaunch on
  # GPU crash + --disable-gpu guard). This YAML override is test-specific.

  - shell: |
      XAUTH=$(ls /run/user/1000/.mutter-Xwaylandauth.* 2>/dev/null | head -1)
      export DISPLAY=:0 XAUTHORITY="$XAUTH" XDG_SESSION_TYPE=wayland WAYLAND_DISPLAY=wayland-0 XDG_RUNTIME_DIR=/run/user/1000
      nohup /opt/Rocket.Chat/rocketchat-desktop --no-sandbox --disable-gpu --ozone-platform=x11 > /dev/null 2>&1 &
      echo APP_LAUNCHED

  - wait: 10

  - verify: "The Rocket.Chat application window shows a server selection screen listing at least two server entries — 'Workspace' and 'Mobile RC'. Look for server name labels, buttons, or cards with these names. This is NOT the 'Add a server' empty screen with only an input field asking for a server URL. The user should see server options to click on"
    verify_timeout: 20

  # ── Tel protocol handler ─────────────────────────────────────────────────
  # With 2+ servers, dispatch triggers the Fuselage server selection modal
  # (introduced in 9d0a4d30f). Not testing modal visual — just crash/no-crash.
  - shell: |
      xdg-open "tel:+5511999999999"
      echo TEL_DISPATCHED

  - wait: 4

  - verify: |
      a new window or dialog appeared in the Rocket.Chat application, related to a
      telephony call or "Callto / Tel" handler. Look for the Fuselage server selection
      dialog listing 'Workspace' and 'Mobile RC' as call destinations.
    verify_timeout: 20

  # ── Click "Close" on the dialog ──────────────────────────────────────────
  # Fuselage dialog may be fullscreen, so click center of screen to close
  - shell: |
      xdotool mousemove 960 540 click 1
      echo CLICKED_CLOSE

  - wait: 3

  # ── Verify app still alive after interaction ─────────────────────────────
  - verify: |
      the Rocket.Chat application window is still visible and responsive. It should
      show the server selection screen or the main chat interface after the dialog
      was dismissed. There should be no crash dialog or error message visible.
    verify_timeout: 15

  # ── Verify Settings shortcut doesn't crash (Ctrl+,) ──────────────────────
  - shell: |
      export DISPLAY=:0
      xdotool key ctrl+comma
      echo SETTINGS_SHORTCUT

  - wait: 5

  # ── Verify app still alive ───────────────────────────────────────────────
  - verify: |
      the Rocket.Chat application window is still visible after the settings
      shortcut was pressed. There should be no crash dialog or error message.
      The app should be responsive.
    verify_timeout: 15

  # ── Cleanup ──────────────────────────────────────────────────────────────
  - shell: |
      pkill -9 -x rocketchat-desktop.bin 2>/dev/null || true
      xdotool search --name "Problem in" windowclose 2>/dev/null || true
      echo CLEANUP_FINAL
