name: "Rocket.Chat Desktop — Click-to-Call master telephony toggle (PR #3325 G1)"
# Covers PR https://github.com/RocketChat/Rocket.Chat.Electron/pull/3325 — Gap G1:
#   F1: Master toggle drives whether tel: dispatches surface the Fuselage modal.
# Worked example: routines-first scenario authoring. See docs/routines.md
# § "Worked example: PR #3325 master-toggle".
#
# NOTE (2026-05-18, updated): isTelephonyEnabled is now pre-staged via
# overridden-settings.json (not config.json). The launch-rocketchat routine writes
# overridden-settings.json alongside config.json; RC merges it on every startup,
# guaranteeing the flag regardless of Redux state. The previous UI-toggle workaround
# (Phase B enabling via Settings) is removed — pre-staging now works correctly.
# See launch-rocketchat.yaml header comment and docs/runbooks/scenario-state-seeding.md.

vars:
  workspace_url: "https://rocketchat.jeanbrito.com"
  mobile_url: "https://mobile.rocket.chat"

phases:
  - id: A
    name: "toggle OFF baseline"
    from_step: 1
  - id: B
    name: "toggle ON via pre-stage"
    from_step: 5

steps:
  # ── A1: cleanup + launch with telephony OFF (default) ────────────────────
  - routine: cleanup-rocketchat
  - routine:
      name: launch-rocketchat
      with:
        servers:
          - { title: "Workspace", url: "{{ workspace_url }}" }
          - { title: "Mobile RC", url: "{{ mobile_url }}" }
        telephony_enabled: false

  # ── A2: dispatch tel: — modal must NOT appear ────────────────────────────
  - routine:
      name: dispatch-tel-link
      with: { number: "+5511999999999" }
  - verify: |
      No telephony Select Server modal is visible. The Rocket.Chat application
      window remains on its login or workspace content — no overlay dialog, no
      server-selection list, no dial pad. The master toggle is OFF so the
      telephony subsystem is dormant and the tel: link was silently ignored.
    verify_not: |
      A telephony modal or dial pad dialog is overlaying the Rocket.Chat window.
      Look for a server selection dialog listing server options,
      or any dialog containing a phone number input or dial pad controls.
    verify_timeout: 15
    retries: 3

  # ── B1: cleanup + relaunch with telephony ON (pre-staged via overridden-settings.json)
  - routine: cleanup-rocketchat
  - routine:
      name: launch-rocketchat
      with:
        servers:
          - { title: "Workspace", url: "{{ workspace_url }}" }
          - { title: "Mobile RC", url: "{{ mobile_url }}" }
        telephony_enabled: true

  # ── B2: dispatch tel: — Fuselage modal MUST appear ───────────────────────
  # Settings panel does not need to be open — the modal overlays whatever RC is showing.
  - routine:
      name: dispatch-tel-link
      with: { number: "+5511999999999" }
  - verify: |
      The Rocket.Chat application window shows a modal dialog for selecting a
      telephony destination server. It lists at least two available servers as
      clickable options (the servers may show their workspace-fetched names
      rather than the configured titles 'Workspace' and 'Mobile RC' — any two
      server entries are acceptable) and has a 'Remember this choice' checkbox.
      This is a Fuselage modal overlay on top of the main application —
      NOT the main server selection screen and NOT the Settings panel.
    verify_timeout: 20
    retries: 5

  # ── B3: dismiss modal ────────────────────────────────────────────────────
  - key: Escape
  - wait: 2

  - routine: verify-app-alive

  # ── final cleanup ────────────────────────────────────────────────────────
  - routine: cleanup-rocketchat
