name: "Tray presence menu (Linux)"
# Tests: verify the tray icon shows presence status (online/away/busy/offline),
# right-click opens context menu with current status + submenu, submenu lists
# Online/Away/Busy/Offline with current one checked.
# Prerequisite: app must be logged in to a workspace (uses smoke test's
# pre-login setup or a pre-seeded workspace).

steps:
  # ── Pre-test cleanup: clean-slate Rocket.Chat ────────────────────────────
  - shell: |
      # Kill RC + helper popups
      pkill -9 -x rocketchat-desktop.bin 2>/dev/null || true
      pkill -x update-manager 2>/dev/null || true
      pkill -x update-notifier 2>/dev/null || true
      for i in 1 2 3 4 5 6 7 8; do
        sleep 1
        pgrep -x rocketchat-desktop.bin >/dev/null || break
        pkill -9 -x rocketchat-desktop.bin 2>/dev/null || true
      done
      # Wipe keyring so login doesn't auto-resume
      pkill -9 gnome-keyring-d 2>/dev/null || true
      sleep 1
      rm -f "$HOME"/.local/share/keyrings/*.keyring
      rm -f "$HOME"/.local/share/keyrings/default
      rm -f "$HOME"/.local/share/keyrings/login.keyring
      rm -rf "$HOME"/.cache/keyring-* 2>/dev/null || true
      # Wipe Electron userData
      rm -rf "$HOME/.config/Rocket.Chat"
      rm -rf "$HOME/.config/Rocket.Chat (development)"
      rm -rf "$HOME/.config/Rocket.Chat Electron"
      for d in "$HOME"/snap/rocketchat-desktop/*/.config/"Rocket.Chat"*; do
        [ -e "$d" ] && rm -rf "$d"
      done
      rm -rf "$HOME/.cache/Rocket.Chat" 2>/dev/null || true
      rm -rf "$HOME/.cache/Rocket.Chat (development)" 2>/dev/null || true
      rm -rf "$HOME/.cache/Rocket.Chat Electron" 2>/dev/null || true
      remaining=$(ls -d "$HOME"/.config/Rocket.Chat* 2>/dev/null | head -1)
      if [ -n "$remaining" ]; then
        echo "cleanup:FAILED — $remaining survived"
        exit 1
      fi
      echo cleanup:ok

  # Reset desktop
  - key: "escape"
    wait: 1

  # Launch and login (reuse smoke test's flow until we're logged in)
  - launch: "{app_path} --no-sandbox"
    wait: 30
    launch_window: "Rocket.Chat"
    verify: "the Rocket.Chat window is open and an input field labeled 'Enter your server URL' is visible under the rocket.chat logo"
    verify_not: "an Email/username input field, a Password input field, a chat history containing messages, or a 'Message #...' composer is visible"
    verify_timeout: 20
    retries: 2

  # Dismiss update dialog if present
  - if_visible: "button with visible text 'Later', 'Dismiss', or 'Not now', OR an X close icon in the top-right corner of an update notification banner or dialog"
    then:
      - localize: "button with visible text 'Later', 'Dismiss', or 'Not now', OR an X close icon in the top-right corner of an update notification banner or dialog"

  # Login flow
  - localize: "the Enter your server URL input text field below the rocket.chat logo"
    verify_click: "the 'Enter your server URL' input text field is focused"
    verify_click_diff: true
    canary: true
    canary_verify: "the character 'q' is visible as plain text inside the 'Enter your server URL' input"
    then_type: "{workspace_url}"
    then_key: "enter"
    verify: "a form with both an Email or username input field AND a labeled Password input field is visible"
    verify_not: "the 'Enter your server URL' input field is still visible, OR an error / offline banner is shown"
    verify_timeout: 25
    retries: 3

  - localize: "the upper input field labeled 'Email or username'"
    verify_click: "the upper Email or username input field is focused"
    verify_click_diff: true
    canary: true
    canary_verify: "the character 'q' is visible as plain text inside the upper Email or username input field"
    then_type: "{test_user}"
    verify_input: "the Email or username field contains the text visible, and the Password field below it is still empty"
    retries: 3

  - localize: "the Password input row — find the small eye icon on the right edge of an input row, and click the empty space INSIDE that input row to its LEFT"
    verify_click: "the Password input row is focused"
    verify_click_diff: true
    then_type: "{test_password}"
    verify_input: "the Password row shows a row of masked dots indicating a typed password is present"
    then_key: "enter"
    verify: "a left-side channel sidebar and a main chat area are visible, and no Password input field is on screen"
    verify_not: "a Password input field, an Email/username field, or an error is visible"
    verify_timeout: 30
    retries: 3

  # Wait for login to fully settle
  - wait: 5

  # ── Tray presence menu validation ──────────────────────────────────────────
  # Now we test the tray icon and presence menu.
  # Locate: grey Rocket.Chat rocket-shaped icon in the system tray.
  # The icon should show a presence bullet: filled green (online), yellow with
  # clock cutout (away), red with bar cutout (busy), hollow grey (offline), or
  # filled amber with "!" (disconnected).

  - localize: "the grey Rocket.Chat rocket-shaped speech-bubble icon with a small coloured circle or bullet in the system tray / top panel"
    click: "right"
    wait: 1
    verify: "a context menu is open whose first item shows a status word (Online, Away, Busy, or Offline) with a small coloured circle icon to its left and a submenu arrow on the right, followed by Show or Hide and Quit"
    verify_timeout: 15
    retries: 2

  # Verify and hover/click the first menu item (status) to open submenu
  - localize: "the first item of the open context menu showing a status word (Online, Away, Busy, or Offline) with a small coloured bullet icon and a submenu arrow"
    click: "left"
    wait: 1
    verify: "a submenu lists Online, Away, Busy and Offline (each with a small coloured circle icon), and one of them has a checkmark indicating the current status"
    verify_timeout: 15
    retries: 2
