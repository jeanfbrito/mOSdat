# qa_flow: TEL-QA-013
# qa_source: https://github.com/RocketChat/Rocket.Chat.Electron/blob/feat/telephony-deeplink/qa/telephony-deeplink/flows/13-localization-layout.md
# Authored 2026-05-22 atop swiss-knife epic Stage 1+2+3 + pointer-mode default.
#
# Mirrors the 5-step QA flow 1:1:
#   1. Set app/system locale to English. → Telephony copy readable.
#   2. Check prompt / diagnostics / server picker / shortcut controls. → no
#      clipping or overlap.
#   3. Repeat in Brazilian Portuguese.
#   4. Repeat in German.
#   5. Resize window to narrow supported width. → text wraps/truncates cleanly.
#
# Locale strategy (single-run constraint):
#   mOSdat cannot toggle Electron app language mid-run. The Rocket.Chat
#   desktop wrapper inherits its UI language from the OS LANG env at launch.
#   No `overridden-settings.json` key has been observed that swaps i18n
#   bundles (only feature-flag keys like isTelephonyEnabled / shortcut config
#   live there — see authoring sweep 2026-05-22, no language/locale/i18n
#   match in the codebase or routines).
#
#   Therefore: this scenario covers the **default (English)** locale on a
#   single live run, exercising steps 1, 2, and 5 (the layout-resize
#   smoke). Steps 3 (pt-BR) and 4 (de-DE) are intentionally documented
#   as future work / manual coverage — see the explicit comments above
#   each placeholder phase. The pre-stage shell exports `LANG=en_US.UTF-8`
#   so the run is deterministic w.r.t. host locale drift.
#
#   To extend to pt-BR / de-DE when a locale-override mechanism lands:
#     - Add a vars parameter (e.g. `vars: {ui_locale: "pt_BR.UTF-8"}`) and
#       inject `export LANG="{{ ui_locale }}"` into the launch shell.
#     - Re-run this scenario three times (en / pt_BR / de_DE) and compare
#       captured screenshots for clipping regressions.
#     - Alternatively, when the desktop wrapper exposes a settings key
#       (e.g. `appLanguage`), add it to the overridden-settings.json block
#       below alongside the telephony keys.
#
# Pattern stolen verbatim from tel-qa-001-settings-discovery.yaml (green
# PASS 27/27) and tel-qa-002-enable-disable-gating.yaml:
#   - cleanup-rocketchat routine bookends
#   - inline userData pre-stage (servers + overridden-settings telephony ON,
#     because TEL-QA-013 requires `telephony_enabled` per the flow front-
#     matter `requires: [telephony_enabled]`)
#   - inline shell launch with XAUTH fallback chain (mutter → gdm →
#     $HOME/.Xauthority) + explicit LANG=en_US.UTF-8 for locale stability
#   - AT-SPI pointer-mode primitives (via: pointer is implicit default)
#   - wait_for + verify_atspi instead of fixed waits + VLM
#
# Live-discovered widget names (ubuntu2204@192.168.13.81, PR3325 head,
# English locale; pt-BR / de-DE label drift is what this flow is meant to
# surface and is therefore intentionally NOT hardcoded as a fallback):
#   - kebab:       push button "Customize and control app"
#   - settings:    menu item "Settings"
#   - tab:         page tab "Voice & Video"
#   - section:     check box "Telephony" inside Voice & Video
#   - server pick: combo box / list item under the Telephony section header
#   - shortcut:    entry / button for the global shortcut accelerator
#   - diagnostics: scroll bar / region with telephony diagnostics copy
#
# Layout proof (Step 5 — narrow viewport):
#   We resize the RC window to a narrow supported width (820 px wide, the
#   minimum the rootWindowState pre-stage typically uses) using wmctrl on
#   the VM, then re-verify the Telephony section + key labels are still
#   findable via AT-SPI. AT-SPI returning the node = the label/role
#   surface survived the resize (clipped-out widgets disappear from the
#   tree); a missing node is the failure signal.
#
# AT-SPI/VLM ratio: 100% AT-SPI. Pure structural assertions. The "visual
# clipping" failure mode TEL-QA-013 is hunting for surfaces in AT-SPI as
# a missing accessible name OR a missing node when the widget gets
# clipped out of the layout — both detectable via wait_for / verify_atspi.

name: "tel-qa-013-localization-layout"
description: |
  TEL-QA-013 — Localization and layout smoke.

  Verifies Telephony UI labels render readably in the default locale (en)
  and that the layout survives a narrow-viewport resize without clipping
  out the key widgets (Telephony toggle, server picker, shortcut). pt-BR
  and de-DE coverage is deferred — see header comments.

vars:
  workspace_url: "https://rocketchat.jeanbrito.com"
  mobile_url: "https://mobile.rocket.chat"
  narrow_width: "820"
  narrow_height: "720"

steps:
  # ── Pre-test cleanup ─────────────────────────────────────────────────────
  - routine: cleanup-rocketchat

  # ── Pre-stage userData (servers + overridden-settings, telephony ON) ─────
  # TEL-QA-013 requires telephony_enabled (flow front-matter). Inlined from
  # launch-rocketchat (Known Issue #1: Wayland-only XAUTH path in routine).
  - shell: |
      set -u
      for d in "$HOME/.config/Rocket.Chat" "$HOME/.config/Rocket.Chat (development)"; do
        mkdir -p "$d"
        cat > "$d/servers.json" <<'JSON'
      {
        "Workspace": "{{ workspace_url }}",
        "Mobile RC": "{{ mobile_url }}"
      }
      JSON
        python3 - "$d" <<'PY'
      import json, sys, os
      d = sys.argv[1]
      first_url = "{{ workspace_url }}"
      if not first_url.endswith("/"):
          first_url += "/"
      mobile_url = "{{ mobile_url }}"
      if not mobile_url.endswith("/"):
          mobile_url += "/"
      config = {
          "servers": [
              {"url": first_url, "title": "Workspace"},
              {"url": mobile_url, "title": "Mobile RC"},
          ],
          "currentView": {"url": first_url},
          "rootWindowState": {
              "focused": True, "visible": True, "maximized": False,
              "minimized": False, "fullscreen": False, "normal": True,
              "bounds": {"x": 40, "y": 40, "width": 1280, "height": 820}
          },
          "lastSelectedServerUrl": first_url,
          "__internal__": {"migrations": {"version": "4.14.1"}}
      }
      open(os.path.join(d, "config.json"), "w").write(json.dumps(config, indent=2))
      overrides = {
          "isTelephonyEnabled": True,
          "telephonyPreferredServer": None,
          "telephonyGlobalShortcutConfig": {"enabled": False, "accelerator": None},
          "isMenuBarEnabled": True,
          "isSideBarEnabled": True,
          "isTrayIconEnabled": False,
          "isMinimizeOnCloseEnabled": False,
          "doCheckForUpdatesOnStartup": False,
          "isUpdatingEnabled": False,
      }
      open(os.path.join(d, "overridden-settings.json"), "w").write(
          json.dumps(overrides, indent=2))
      PY
      done
      echo USERDATA_STAGED

  # ── QA-013-step1: Set app/system locale to English + launch ──────────────
  # Inline shell launch with XAUTH fallback chain + explicit LANG=en_US.UTF-8.
  # If en_US.UTF-8 is not generated on the VM, fall back to C.UTF-8 (English
  # English, default-locale-compatible). The LC_ALL guard prevents partial-
  # locale drift from e.g. LC_NUMERIC.
  - label: "QA-013-step1: launch Rocket.Chat with LANG=en_US.UTF-8"
    shell: |
      XAUTH=$(ls /run/user/1000/.mutter-Xwaylandauth.* 2>/dev/null | head -1)
      [ -z "$XAUTH" ] && XAUTH=$(ls /run/user/1000/gdm/Xauthority 2>/dev/null | head -1)
      [ -z "$XAUTH" ] && XAUTH="$HOME/.Xauthority"
      export DISPLAY=:0
      [ -n "$XAUTH" ] && [ -f "$XAUTH" ] && export XAUTHORITY="$XAUTH"
      if locale -a 2>/dev/null | grep -qi '^en_US.utf'; then
        export LANG=en_US.UTF-8
      else
        export LANG=C.UTF-8
      fi
      export LC_ALL="$LANG"
      echo "USING_LANG=$LANG"
      ACCESSIBILITY_ENABLED=1 nohup /opt/Rocket.Chat/rocketchat-desktop \
        --no-sandbox --disable-gpu --ozone-platform=x11 \
        --force-renderer-accessibility \
        >/dev/null 2>&1 &
      for i in $(seq 1 30); do
        if wmctrl -l 2>/dev/null | grep -q Rocket.Chat; then
          echo "window up after ${i}s"
          break
        fi
        sleep 1
      done

  - label: "QA-013-step1: wait_for main window frame (English locale)"
    wait_for: {any: [{role: "frame"}], timeout: 30}
    retries: 1

  # ── QA-013-step1: Navigate to Settings → Voice & Video ───────────────────
  # The QA-flow "Telephony settings copy is readable" assertion requires us
  # to actually land on the Voice & Video tab where the Telephony section
  # paints — readability of labels we never opened is meaningless.
  - label: "QA-013-step1: wait_for kebab button"
    wait_for: {any: [{role: "push button", name: "Customize and control app"}], timeout: 30}
    retries: 1

  - label: "QA-013-step1: click kebab (Customize and control app)"
    atspi: {role: "push button", name: "Customize and control app"}
    retries: 1

  - label: "QA-013-step1: wait_for Settings menu item"
    wait_for: {any: [{role: "menu item", name: "Settings"}], timeout: 30}
    retries: 1

  - label: "QA-013-step1: click Settings menu item"
    atspi: {role: "menu item", name: "Settings"}
    retries: 1

  - label: "QA-013-step1: verify Settings screen opened (General tab)"
    wait_for: {any: [{role: "page tab", name: "General"}], timeout: 10}
    retries: 1

  - label: "QA-013-step1: click Voice & Video tab"
    atspi: {role: "page tab", name: "Voice & Video"}
    retries: 1

  - label: "QA-013-step1: wait_for Telephony section (Voice & Video opened)"
    wait_for: {any: [{role: "check box", name: "Telephony"}], timeout: 15}
    retries: 1

  # ── QA-013-step2: Check prompt / diagnostics / picker / shortcut surfaces ─
  # Each surface gets an explicit verify_atspi. A missing widget here in
  # English is a hard fail (the label should never disappear in the default
  # locale). pt-BR / de-DE would re-run these same assertions against
  # translated label fragments — see header comments.

  - label: "QA-013-step2a: verify Telephony section label visible (en)"
    verify_atspi: {role: "check box", name: "Telephony"}
    retries: 1

  # The "Voice & Video" page tab label itself is a localization surface —
  # if the i18n bundle for the active locale fails to load, this tab name
  # falls back to a key path like "voice_video.tab.title" which AT-SPI
  # would still surface but with a non-readable string. We assert by exact
  # English text here; non-en runs would relax this to name_substr.
  - label: "QA-013-step2b: verify Voice & Video tab label readable (en)"
    verify_atspi: {role: "page tab", name: "Voice & Video"}
    retries: 1

  # Telephony server picker — combo box or list inside the Voice & Video
  # pane. Its presence (post-toggle-ON pre-stage) confirms the server
  # picker copy renders. We use name_substr against "server" since the
  # exact wrapper widget label has historically drifted between
  # "Preferred server" and "Telephony server" copy in the PR build.
  - label: "QA-013-step2c: verify server picker surface visible"
    wait_for:
      any:
        - {role: "combo box", name_substr: "server"}
        - {role: "label", name_substr: "Preferred"}
        - {role: "label", name_substr: "server"}
      timeout: 10
    retries: 1

  # Global shortcut control — TEL-QA-013 step 2 explicitly lists "shortcut
  # controls" as a copy/layout surface. The shortcut UI surfaces as an
  # entry field for the accelerator + a toggle / button. We tolerate any
  # of: an entry named "shortcut", a label naming "shortcut", or the
  # shortcut toggle check box.
  - label: "QA-013-step2d: verify shortcut control surface visible"
    wait_for:
      any:
        - {role: "label", name_substr: "shortcut"}
        - {role: "label", name_substr: "Shortcut"}
        - {role: "entry", name_substr: "shortcut"}
        - {role: "check box", name_substr: "shortcut"}
      timeout: 10
    retries: 1

  # Diagnostics surface — TEL-QA-004 covers diagnostics depth; here we
  # only assert its copy is present in Voice & Video (per TEL-QA-013
  # step 2 "check ... diagnostics"). The diagnostics panel collapses
  # by default; its trigger / heading label is the anchor.
  - label: "QA-013-step2e: verify diagnostics trigger label visible"
    wait_for:
      any:
        - {role: "label", name_substr: "iagnostic"}
        - {role: "push button", name_substr: "iagnostic"}
        - {role: "toggle button", name_substr: "iagnostic"}
        - {role: "section", name_substr: "iagnostic"}
      timeout: 10
    retries: 1

  # ── QA-013-step3 (pt-BR): DEFERRED — single-locale constraint ────────────
  # The QA flow requires re-running steps 1-2 with the app in pt-BR. mOSdat
  # has no locale-override hook today (see header). When automation lands:
  #   - Re-launch RC with LANG=pt_BR.UTF-8 (the en_US -> pt_BR substitution
  #     in the step-1 shell block).
  #   - Re-run step2 assertions but with the Portuguese translation
  #     fragments (e.g. "Telefonia" instead of "Telephony" — confirm
  #     with the i18n source bundle before hardcoding).
  # For this single run we acknowledge step 3 as not executed, NOT failed.
  - label: "QA-013-step3: pt-BR coverage deferred (single-locale constraint)"
    shell: |
      echo "TEL-QA-013 step 3 (pt-BR) NOT RUN on this scenario invocation."
      echo "Re-run with LANG=pt_BR.UTF-8 once a locale-override hook exists."
      exit 0

  # ── QA-013-step4 (de-DE): DEFERRED — single-locale constraint ────────────
  - label: "QA-013-step4: de-DE coverage deferred (single-locale constraint)"
    shell: |
      echo "TEL-QA-013 step 4 (de-DE) NOT RUN on this scenario invocation."
      echo "Re-run with LANG=de_DE.UTF-8 once a locale-override hook exists."
      echo "Watch German specifically for long-compound-word label overflow"
      echo "(de typically expands ~30% vs en — the main TEL-QA-013 risk)."
      exit 0

  # ── QA-013-step5: Resize window to a narrow supported width ──────────────
  # Use wmctrl on the VM to move+resize the RC window to {{ narrow_width }} x
  # {{ narrow_height }}. Then re-verify the Telephony section and the
  # surface labels are still findable. AT-SPI returns nodes for visible-
  # accessible widgets; clipped widgets typically drop out of the tree
  # (or lose their accessible name), so re-finding them is the assertion.
  - label: "QA-013-step5a: resize RC window to narrow {{ narrow_width }}x{{ narrow_height }}"
    shell: |
      XAUTH=$(ls /run/user/1000/.mutter-Xwaylandauth.* 2>/dev/null | head -1)
      [ -z "$XAUTH" ] && XAUTH=$(ls /run/user/1000/gdm/Xauthority 2>/dev/null | head -1)
      [ -z "$XAUTH" ] && XAUTH="$HOME/.Xauthority"
      export DISPLAY=:0
      [ -n "$XAUTH" ] && [ -f "$XAUTH" ] && export XAUTHORITY="$XAUTH"
      WIN_ID=$(wmctrl -l 2>/dev/null | grep Rocket.Chat | head -1 | awk '{print $1}')
      if [ -z "$WIN_ID" ]; then
        echo "FAILED — could not find Rocket.Chat window via wmctrl" >&2
        wmctrl -l >&2
        exit 1
      fi
      # Un-maximize first (resize is ignored on maximized windows).
      wmctrl -i -r "$WIN_ID" -b remove,maximized_vert,maximized_horz 2>/dev/null || true
      # wmctrl -e GRAVITY,X,Y,W,H — gravity 0 = default.
      wmctrl -i -r "$WIN_ID" -e "0,80,80,{{ narrow_width }},{{ narrow_height }}"
      sleep 1
      # Confirm new geometry.
      NEW_GEOM=$(xdotool getwindowgeometry "$WIN_ID" 2>/dev/null | awk '/Geometry/ {print $2}')
      echo "WIN_ID=$WIN_ID NEW_GEOM=$NEW_GEOM"

  - label: "QA-013-step5b: wait_for layout settle (frame still present)"
    wait_for: {any: [{role: "frame"}], timeout: 10}
    retries: 1

  - label: "QA-013-step5c: verify Telephony section survives narrow viewport"
    verify_atspi: {role: "check box", name: "Telephony"}
    retries: 2

  - label: "QA-013-step5d: verify Voice & Video tab survives narrow viewport"
    verify_atspi: {role: "page tab", name: "Voice & Video"}
    retries: 2

  # Narrow-width regression catcher: at 820 px wide the secondary surfaces
  # (server picker, shortcut, diagnostics trigger) should still be reachable
  # by AT-SPI even if they wrap or stack vertically. A missing node here is
  # the TEL-QA-013 "Failure Signals" condition surfacing:
  #   "Buttons overlap body text. Diagnostics details overflow outside panel."
  - label: "QA-013-step5e: verify server picker surface survives narrow viewport"
    wait_for:
      any:
        - {role: "combo box", name_substr: "server"}
        - {role: "label", name_substr: "Preferred"}
        - {role: "label", name_substr: "server"}
      timeout: 10
    retries: 2

  - label: "QA-013-step5f: verify shortcut surface survives narrow viewport"
    wait_for:
      any:
        - {role: "label", name_substr: "shortcut"}
        - {role: "label", name_substr: "Shortcut"}
        - {role: "entry", name_substr: "shortcut"}
        - {role: "check box", name_substr: "shortcut"}
      timeout: 10
    retries: 2

  - label: "QA-013-step5g: verify diagnostics surface survives narrow viewport"
    wait_for:
      any:
        - {role: "label", name_substr: "iagnostic"}
        - {role: "push button", name_substr: "iagnostic"}
        - {role: "toggle button", name_substr: "iagnostic"}
        - {role: "section", name_substr: "iagnostic"}
      timeout: 10
    retries: 2

  # ── Final cleanup ────────────────────────────────────────────────────────
  - routine: cleanup-rocketchat
