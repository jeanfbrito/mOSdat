name: "Rocket.Chat Desktop — Auto reset + single-server (overridden-settings.json)"
# Covers PR https://github.com/RocketChat/Rocket.Chat.Electron/pull/3325:
#   G3: telephonyPreferredServer reset (Auto) → modal re-appears
#   G4: single server → no modal on dispatch
#
# Strategy: telephony state is pre-staged via overridden-settings.json through the
# launch-rocketchat routine. No direct config.json manipulation — RC's Redux-persist
# ignores top-level config.json writes for feature flags; overridden-settings.json is
# merged on every startup and guarantees the value. See docs/runbooks/scenario-state-seeding.md.
#
# PHASES:
#   A. 2 servers, preferred=null → tel: → modal appears → click 'Mobile RC'.
#   B. Kill, relaunch with preferred=mobile → tel: → NO modal (direct route).
#   C. Kill, reset preferred=null → tel: → modal RE-APPEARS (Auto reset verified).
#   D. Kill, single-server config → tel: → NO modal (auto-route, G4).

vars:
  workspace_url: "https://rocketchat.jeanbrito.com"
  mobile_url: "https://mobile.rocket.chat"

phases:
  - id: A
    name: "2-server, preferred=null → modal"
    from_step: 1
  - id: B
    name: "preferred=mobile → no modal"
    from_step: 8
  - id: C
    name: "preferred reset to null → modal re-appears"
    from_step: 12
  - id: D
    name: "single server → no modal"
    from_step: 19

steps:
  # ════════════════════════════════════════════════════════════════════════════
  # PHASE A — 2 servers, preferred=null → modal appears
  # ════════════════════════════════════════════════════════════════════════════

  # ── A1: cleanup + launch with telephony ON, preferred=null (Auto) ─────────
  - routine: cleanup-rocketchat
  - routine:
      name: launch-rocketchat
      with:
        servers:
          - { title: "Workspace", url: "{{ workspace_url }}" }
          - { title: "Mobile RC", url: "{{ mobile_url }}" }
        telephony_enabled: true
        preferred_server_url: null

  # ── A2: dispatch tel: → modal must appear ────────────────────────────────
  - routine:
      name: dispatch-tel-link
      with: { number: "+5511999999999" }

  - verify: |
      The Rocket.Chat application window shows a modal dialog labeled 'Select
      Server' (or similar) asking which server should handle the call. The
      modal lists at least two server rows as clickable options (the servers
      may show their workspace-fetched names rather than the configured titles
      'Workspace' / 'Mobile RC' — any two server entries are acceptable) and
      has a 'Remember this choice' checkbox. This is a Fuselage modal overlay
      on top of the main application.
    verify_timeout: 20
    retries: 5

  # ── A3: click 'Mobile RC' in modal ───────────────────────────────────────
  - localize: "the 'Mobile RC' server option inside the telephony server selection modal"
    click: left
  - wait: 8

  - verify: |
      The Rocket.Chat application window is visible and responsive — the
      telephony server selection modal is no longer visible. The app is alive
      with no crash dialog.
    verify_timeout: 20
    retries: 3

  # ════════════════════════════════════════════════════════════════════════════
  # PHASE B — preferred=mobile → no modal, direct route
  # ════════════════════════════════════════════════════════════════════════════

  # ── B1: cleanup + relaunch with preferred server set ─────────────────────
  - routine: cleanup-rocketchat
  - routine:
      name: launch-rocketchat
      with:
        servers:
          - { title: "Workspace", url: "{{ workspace_url }}" }
          - { title: "Mobile RC", url: "{{ mobile_url }}" }
        telephony_enabled: true
        preferred_server_url: "https://mobile.rocket.chat/"

  # ── B2: dispatch tel: → NO modal (direct route to Mobile RC) ─────────────
  - routine:
      name: dispatch-tel-link
      with: { number: "+5511999999999" }

  - verify: |
      The Rocket.Chat application window is visible and responsive.
      No telephony server selection modal is shown. App alive, no crash dialog.
      (The "call routed directly to preferred server" is the absence of the modal
      — don't ask the VLM to assert routing it can't see.)
    verify_not: |
      A telephony server selection modal listing two server rows with a
      'Remember this choice' checkbox is visible overlaying the window.
    verify_timeout: 20
    retries: 5

  # ════════════════════════════════════════════════════════════════════════════
  # PHASE C — preferred reset to null (Auto) → modal re-appears
  # ════════════════════════════════════════════════════════════════════════════

  # ── C1: cleanup + relaunch with preferred=null (simulates "Auto" selection) ─
  - routine: cleanup-rocketchat
  - routine:
      name: launch-rocketchat
      with:
        servers:
          - { title: "Workspace", url: "{{ workspace_url }}" }
          - { title: "Mobile RC", url: "{{ mobile_url }}" }
        telephony_enabled: true
        preferred_server_url: null

  # ── C2: dispatch tel: → modal RE-APPEARS ────────────────────────────────
  - routine:
      name: dispatch-tel-link
      with: { number: "+5511999999999" }

  - verify: |
      The Rocket.Chat application window shows a modal dialog for selecting a
      telephony destination server. The modal lists at least two server rows
      as clickable options (servers may show workspace-fetched names rather
      than configured titles 'Workspace' / 'Mobile RC' — any two entries are
      acceptable) and has a 'Remember this choice' checkbox.
    verify_timeout: 20
    retries: 5

  - key: Escape
  - wait: 3

  - routine: verify-app-alive

  # ════════════════════════════════════════════════════════════════════════════
  # PHASE D — single server → no modal on dispatch
  # ════════════════════════════════════════════════════════════════════════════

  # ── D1: cleanup + relaunch with ONE server only ───────────────────────────
  - routine: cleanup-rocketchat
  - routine:
      name: launch-rocketchat
      with:
        servers:
          - { title: "Workspace", url: "{{ workspace_url }}" }
        telephony_enabled: true
        preferred_server_url: null

  # ── D2: dispatch tel: → NO modal (single server auto-routes) ─────────────
  - routine:
      name: dispatch-tel-link
      with: { number: "+5511999999999" }

  - verify: |
      The Rocket.Chat application window is visible and responsive — there is
      NO telephony server selection modal visible. With only one server
      configured the call is routed directly without a selection dialog. App
      alive, no crash dialog.
    verify_not: |
      A telephony server selection modal listing server names with a 'Remember
      this choice' checkbox is visible overlaying the window.
    verify_timeout: 20
    retries: 5

  # ════════════════════════════════════════════════════════════════════════════
  # FINAL CLEANUP
  # ════════════════════════════════════════════════════════════════════════════
  - routine: cleanup-rocketchat
