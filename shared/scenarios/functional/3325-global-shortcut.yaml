name: "Rocket.Chat Desktop — Global Telephony Shortcut (pre-staged Redux)"
# Covers PR https://github.com/RocketChat/Rocket.Chat.Electron/pull/3325 §F5:
#   globalShortcut.register(accelerator) fires when
#   telephonyGlobalShortcutConfig.enabled && accelerator != null && isTelephonyEnabled.
#
# Strategy: pre-stage all Redux telephony state in config.json. No Settings UI.
# Each phase rewrites config.json + relaunches RC to apply the new state.
#
# PHASES:
#   1. enabled=true, accelerator="Ctrl+Shift+P", clipboard=phone → dial pad pre-filled.
#   2. clipboard=non-phone "hello" → dial pad opens empty, no error.
#   3. isTelephonyEnabled=false → shortcut unregistered, key combo does nothing.

steps:
  # ════════════════════════════════════════════════════════════════════════════
  # PRE-FLIGHT — tool deps
  # ════════════════════════════════════════════════════════════════════════════
  - shell: |
      set -e
      if ! command -v wmctrl >/dev/null 2>&1 || ! command -v xclip >/dev/null 2>&1; then
        if command -v apt-get >/dev/null 2>&1; then
          sudo env DEBIAN_FRONTEND=noninteractive apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y wmctrl xclip xterm
        fi
      fi
      missing=""
      for tool in xdotool wmctrl xterm; do
        which "$tool" >/dev/null 2>&1 || missing="$missing $tool"
      done
      if ! which xclip >/dev/null 2>&1 && ! which xsel >/dev/null 2>&1; then
        missing="$missing xclip-or-xsel"
      fi
      if [ -n "$missing" ]; then
        echo "MISSING TOOLS:$missing"; exit 1
      fi
      echo TOOLS_OK

  # ════════════════════════════════════════════════════════════════════════════
  # PHASE 1 — shortcut enabled + phone clipboard → dial pad pre-filled
  # ════════════════════════════════════════════════════════════════════════════

  # ── P1a: Kill RC + wipe userData ─────────────────────────────────────────
  - shell: |
      set -u
      export DISPLAY=:0
      export XAUTHORITY="${XAUTHORITY:-$(ls /run/user/1000/.mutter-Xwaylandauth.* 2>/dev/null | head -1)}"
      for attempt in 1 2 3 4 5 6 7 8; do
        pkill -TERM -f '/opt/Rocket.Chat' 2>/dev/null || true
        pkill -TERM -f 'rocketchat-desktop' 2>/dev/null || true
        pkill -TERM -f 'Rocket.Chat' 2>/dev/null || true
        sleep 1
        pgrep -af '(/opt/Rocket.Chat|rocketchat-desktop|Rocket.Chat)' >/dev/null 2>&1 || break
      done
      pkill -KILL -f '/opt/Rocket.Chat' 2>/dev/null || true
      pkill -KILL -f 'rocketchat-desktop' 2>/dev/null || true
      pkill -KILL -f 'Rocket.Chat' 2>/dev/null || true
      pkill -KILL -x apport-gtk 2>/dev/null || true
      wmctrl -l 2>/dev/null | awk 'BEGIN{IGNORECASE=1} /Rocket.Chat|rocketchat|Problem in|apport|System program problem/ {print $1}' | while read -r wid; do
        wmctrl -i -c "$wid" 2>/dev/null || xdotool windowkill "$wid" 2>/dev/null || true
      done
      for d in "$HOME/.config/Rocket.Chat" "$HOME/.config/Rocket.Chat (development)"; do
        rm -rf "$d"; mkdir -p "$d"
      done
      echo P1_CLEAN

  # ── P1b: Pre-stage config: telephony ON, shortcut Ctrl+Shift+P enabled ───
  - shell: |
      set -u
      for d in "$HOME/.config/Rocket.Chat" "$HOME/.config/Rocket.Chat (development)"; do
        printf '%s\n' \
          '{' \
          '  "Workspace": "https://rocketchat.jeanbrito.com",' \
          '  "Mobile RC": "https://mobile.rocket.chat"' \
          '}' > "$d/servers.json"
        printf '%s\n' \
          '{' \
          '  "servers": [' \
          '    { "url": "https://rocketchat.jeanbrito.com/", "title": "Workspace" },' \
          '    { "url": "https://mobile.rocket.chat/", "title": "Mobile RC" }' \
          '  ],' \
          '  "currentView": { "url": "https://rocketchat.jeanbrito.com/" },' \
          '  "isTelephonyEnabled": true,' \
          '  "telephonyPreferredServer": "https://rocketchat.jeanbrito.com/",' \
          '  "telephonyGlobalShortcutConfig": { "enabled": true, "accelerator": "Ctrl+Shift+P" },' \
          '  "isMenuBarEnabled": true,' \
          '  "isSideBarEnabled": true,' \
          '  "isTrayIconEnabled": false,' \
          '  "isMinimizeOnCloseEnabled": false,' \
          '  "doCheckForUpdatesOnStartup": false,' \
          '  "isUpdatingEnabled": false,' \
          '  "rootWindowState": {' \
          '    "focused": true, "visible": true, "maximized": false, "minimized": false,' \
          '    "fullscreen": false, "normal": true,' \
          '    "bounds": { "x": 40, "y": 40, "width": 1280, "height": 820 }' \
          '  },' \
          '  "lastSelectedServerUrl": "https://rocketchat.jeanbrito.com/",' \
          '  "__internal__": { "migrations": { "version": "4.14.1" } }' \
          '}' > "$d/config.json"
      done
      echo P1_CONFIG_WRITTEN

  # ── P1c: Launch RC ───────────────────────────────────────────────────────
  - shell: |
      XAUTH=$(ls /run/user/1000/.mutter-Xwaylandauth.* 2>/dev/null | head -1)
      export DISPLAY=:0 XAUTHORITY="$XAUTH"
      nohup /opt/Rocket.Chat/rocketchat-desktop --no-sandbox --disable-gpu --ozone-platform=x11 >/dev/null 2>&1 &
      echo P1_APP_LAUNCHED

  - wait: 18

  # ── P1d: Verify Workspace login page ─────────────────────────────────────
  - verify: |
      The Rocket.Chat application window shows the Workspace server login or
      authentication page, or a connected Workspace page. It must NOT be an
      'Add a server' screen and must NOT be a crash dialog.
    verify_timeout: 30
    retries: 3

  # ── P1e: Set clipboard to phone number, focus xterm, fire shortcut ───────
  - shell: |
      set -u
      XAUTH=$(ls /run/user/1000/.mutter-Xwaylandauth.* 2>/dev/null | head -1)
      export DISPLAY=:0 XAUTHORITY="$XAUTH"
      PHONE='+18005550199'
      if which xclip >/dev/null 2>&1; then
        printf '%s' "$PHONE" | xclip -selection clipboard
      else
        printf '%s' "$PHONE" | xsel --clipboard --input
      fi
      # Open an xterm to steal focus away from RC
      if ! wmctrl -l 2>/dev/null | grep -qi xterm; then
        nohup xterm -geometry 80x24+100+100 >/dev/null 2>&1 &
        sleep 2
      fi
      wmctrl -a xterm 2>/dev/null || true
      sleep 1
      # Fire the registered global shortcut from outside RC
      xdotool key ctrl+shift+p
      echo P1_SHORTCUT_FIRED_PHONE

  - wait: 6

  # ── P1f: Verify dial pad shows the parsed phone number ──────────────────
  - verify: |
      The Rocket.Chat application window is focused and in the foreground.
      A dial pad or telephony dialer panel is visible. The number input field
      is pre-filled with the phone number from the clipboard — expect to see
      '+18005550199', '18005550199', '(800) 555-0199', '+1 (800) 555-0199',
      or a similar normalized form. It MUST NOT be empty and MUST NOT show a
      crash dialog or apport handler.
    verify_timeout: 25
    verify_consistent: true
    retries: 5

  # ════════════════════════════════════════════════════════════════════════════
  # PHASE 2 — non-phone clipboard → dial pad opens empty, no error
  # ════════════════════════════════════════════════════════════════════════════

  # Close dial pad
  - key: Escape
  - wait: 2

  - shell: |
      set -u
      XAUTH=$(ls /run/user/1000/.mutter-Xwaylandauth.* 2>/dev/null | head -1)
      export DISPLAY=:0 XAUTHORITY="$XAUTH"
      TEXT='hello'
      if which xclip >/dev/null 2>&1; then
        printf '%s' "$TEXT" | xclip -selection clipboard
      else
        printf '%s' "$TEXT" | xsel --clipboard --input
      fi
      wmctrl -a xterm 2>/dev/null || true
      sleep 1
      xdotool key ctrl+shift+p
      echo P2_SHORTCUT_FIRED_NONPHONE

  - wait: 6

  - accept_any:
      - "A dial pad or telephony dialer panel is visible with an empty number input field — no pre-filled number"
      - "The Rocket.Chat main UI (login page or workspace content) is visible and unchanged — no dial pad, no error dialog"
    verify_timeout: 15
    retries: 3

  # ════════════════════════════════════════════════════════════════════════════
  # PHASE 3 — telephony OFF → shortcut unregistered, key combo does nothing
  # ════════════════════════════════════════════════════════════════════════════

  - key: Escape
  - wait: 2

  # ── P3a: Kill RC ─────────────────────────────────────────────────────────
  - shell: |
      export DISPLAY=:0
      for attempt in 1 2 3 4 5 6; do
        pkill -TERM -f '/opt/Rocket.Chat' 2>/dev/null || true
        pkill -TERM -f 'rocketchat-desktop' 2>/dev/null || true
        pkill -TERM -f 'Rocket.Chat' 2>/dev/null || true
        sleep 1
        pgrep -af '(/opt/Rocket.Chat|rocketchat-desktop|Rocket.Chat)' >/dev/null 2>&1 || break
      done
      pkill -KILL -f '/opt/Rocket.Chat' 2>/dev/null || true
      pkill -KILL -f 'rocketchat-desktop' 2>/dev/null || true
      pgrep -af '(/opt/Rocket.Chat|rocketchat-desktop)' && exit 1 || echo P3_KILLED

  # ── P3b: Rewrite config: isTelephonyEnabled=false ────────────────────────
  - shell: |
      set -u
      for d in "$HOME/.config/Rocket.Chat" "$HOME/.config/Rocket.Chat (development)"; do
        printf '%s\n' \
          '{' \
          '  "servers": [' \
          '    { "url": "https://rocketchat.jeanbrito.com/", "title": "Workspace" },' \
          '    { "url": "https://mobile.rocket.chat/", "title": "Mobile RC" }' \
          '  ],' \
          '  "currentView": { "url": "https://rocketchat.jeanbrito.com/" },' \
          '  "isTelephonyEnabled": false,' \
          '  "telephonyPreferredServer": null,' \
          '  "telephonyGlobalShortcutConfig": { "enabled": true, "accelerator": "Ctrl+Shift+P" },' \
          '  "isMenuBarEnabled": true,' \
          '  "isSideBarEnabled": true,' \
          '  "isTrayIconEnabled": false,' \
          '  "isMinimizeOnCloseEnabled": false,' \
          '  "doCheckForUpdatesOnStartup": false,' \
          '  "isUpdatingEnabled": false,' \
          '  "rootWindowState": {' \
          '    "focused": true, "visible": true, "maximized": false, "minimized": false,' \
          '    "fullscreen": false, "normal": true,' \
          '    "bounds": { "x": 40, "y": 40, "width": 1280, "height": 820 }' \
          '  },' \
          '  "lastSelectedServerUrl": "https://rocketchat.jeanbrito.com/",' \
          '  "__internal__": { "migrations": { "version": "4.14.1" } }' \
          '}' > "$d/config.json"
      done
      echo P3_CONFIG_TELEPHONY_OFF

  # ── P3c: Launch RC ───────────────────────────────────────────────────────
  - shell: |
      XAUTH=$(ls /run/user/1000/.mutter-Xwaylandauth.* 2>/dev/null | head -1)
      export DISPLAY=:0 XAUTHORITY="$XAUTH"
      nohup /opt/Rocket.Chat/rocketchat-desktop --no-sandbox --disable-gpu --ozone-platform=x11 >/dev/null 2>&1 &
      echo P3_APP_LAUNCHED

  - wait: 18

  - verify: |
      The Rocket.Chat application window shows the Workspace server login or
      authentication page. It must NOT be a crash dialog.
    verify_timeout: 30
    retries: 3

  # ── P3d: Focus xterm, fire shortcut, verify RC stays in background ────────
  - shell: |
      set -u
      XAUTH=$(ls /run/user/1000/.mutter-Xwaylandauth.* 2>/dev/null | head -1)
      export DISPLAY=:0 XAUTHORITY="$XAUTH"
      if ! wmctrl -l 2>/dev/null | grep -qi xterm; then
        nohup xterm -geometry 80x24+100+100 >/dev/null 2>&1 &
        sleep 2
      fi
      wmctrl -a xterm 2>/dev/null || true
      sleep 1
      xdotool key ctrl+shift+p
      echo P3_SHORTCUT_FIRED_TELEPHONY_OFF

  - wait: 5

  - verify: |
      The xterm or terminal window is the active foreground window. The
      Rocket.Chat application window did NOT come to the foreground and NO
      dial pad opened — the global shortcut was never registered because
      isTelephonyEnabled is false in the persisted config.
    verify_not: |
      A Rocket.Chat dial pad or telephony dialer panel is visible in the
      foreground over the xterm window.
    verify_timeout: 20
    retries: 5

  # ════════════════════════════════════════════════════════════════════════════
  # FINAL CLEANUP
  # ════════════════════════════════════════════════════════════════════════════
  - shell: |
      export DISPLAY=:0
      for attempt in 1 2 3 4 5 6; do
        pkill -TERM -f '/opt/Rocket.Chat' 2>/dev/null || true
        pkill -TERM -f 'rocketchat-desktop' 2>/dev/null || true
        pkill -TERM -f 'Rocket.Chat' 2>/dev/null || true
        sleep 1
        pgrep -af '(/opt/Rocket.Chat|rocketchat-desktop|Rocket.Chat)' >/dev/null 2>&1 || break
      done
      pkill -KILL -f '/opt/Rocket.Chat' 2>/dev/null || true
      pkill -KILL -f 'rocketchat-desktop' 2>/dev/null || true
      pkill -KILL -x xterm 2>/dev/null || true
      pkill -KILL -x apport-gtk 2>/dev/null || true
      for d in "$HOME/.config/Rocket.Chat" "$HOME/.config/Rocket.Chat (development)"; do
        rm -rf "$d"
      done
      echo DONE
