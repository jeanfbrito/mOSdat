name: "Rocket.Chat Desktop — PR #3325 link format parser (pre-staged Redux)"
# Covers PR https://github.com/RocketChat/Rocket.Chat.Electron/pull/3325 §F6:
#   src/telephony/links.ts — Various Link Formats
#
# Strategy: pre-stage isTelephonyEnabled=true and telephonyPreferredServer set
# to the single workspace. No modal, no Settings UI. Each format dispatch is a
# nohup second-instance; assertion is "app alive after every variant" with a
# best-effort dial-pad localize.
#
# Formats:
#   F1 tel:+491234567890
#   F2 callto:+1-800-555-0199
#   F3 callto://+491234567890
#   F4 tel:(049) 123-456.78
#   F5 tel:+1-800-555-0199;ext=123
#   F6 tel:abc           (malformed — must NOT crash)

steps:
  # ════════════════════════════════════════════════════════════════════════════
  # PHASE 1 — cleanup + pre-stage single-server config with telephony ON
  # ════════════════════════════════════════════════════════════════════════════

  - shell: |
      set -u
      if ! command -v wmctrl >/dev/null 2>&1 || ! command -v xclip >/dev/null 2>&1; then
        if command -v apt-get >/dev/null 2>&1; then
          sudo env DEBIAN_FRONTEND=noninteractive apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y wmctrl xclip
        fi
      fi
      export DISPLAY=:0
      export XAUTHORITY="${XAUTHORITY:-$(ls /run/user/1000/.mutter-Xwaylandauth.* 2>/dev/null | head -1)}"
      for attempt in 1 2 3 4 5 6 7 8; do
        pkill -TERM -f '/opt/Rocket.Chat' 2>/dev/null || true
        pkill -TERM -f 'rocketchat-desktop' 2>/dev/null || true
        pkill -TERM -f 'Rocket.Chat' 2>/dev/null || true
        sleep 1
        pgrep -af '(/opt/Rocket.Chat|rocketchat-desktop|Rocket.Chat)' >/dev/null 2>&1 || break
      done
      pkill -KILL -f '/opt/Rocket.Chat' 2>/dev/null || true
      pkill -KILL -f 'rocketchat-desktop' 2>/dev/null || true
      pkill -KILL -f 'Rocket.Chat' 2>/dev/null || true
      pkill -KILL -x apport-gtk 2>/dev/null || true
      wmctrl -l 2>/dev/null | awk 'BEGIN{IGNORECASE=1} /Rocket.Chat|rocketchat|Problem in|apport|System program problem/ {print $1}' | while read -r wid; do
        wmctrl -i -c "$wid" 2>/dev/null || xdotool windowkill "$wid" 2>/dev/null || true
      done
      for d in "$HOME/.config/Rocket.Chat" "$HOME/.config/Rocket.Chat (development)"; do
        rm -rf "$d"; mkdir -p "$d"
      done
      echo P1_CLEAN

  - shell: |
      set -u
      for d in "$HOME/.config/Rocket.Chat" "$HOME/.config/Rocket.Chat (development)"; do
        printf '%s\n' \
          '{' \
          '  "Workspace": "https://rocketchat.jeanbrito.com"' \
          '}' > "$d/servers.json"
        printf '%s\n' \
          '{' \
          '  "servers": [' \
          '    { "url": "https://rocketchat.jeanbrito.com/", "title": "Workspace" }' \
          '  ],' \
          '  "currentView": { "url": "https://rocketchat.jeanbrito.com/" },' \
          '  "isTelephonyEnabled": true,' \
          '  "telephonyPreferredServer": "https://rocketchat.jeanbrito.com/",' \
          '  "telephonyGlobalShortcutConfig": { "enabled": false, "accelerator": null },' \
          '  "isMenuBarEnabled": true,' \
          '  "isSideBarEnabled": true,' \
          '  "isTrayIconEnabled": false,' \
          '  "isMinimizeOnCloseEnabled": false,' \
          '  "doCheckForUpdatesOnStartup": false,' \
          '  "isUpdatingEnabled": false,' \
          '  "rootWindowState": {' \
          '    "focused": true, "visible": true, "maximized": false, "minimized": false,' \
          '    "fullscreen": false, "normal": true,' \
          '    "bounds": { "x": 40, "y": 40, "width": 1280, "height": 820 }' \
          '  },' \
          '  "lastSelectedServerUrl": "https://rocketchat.jeanbrito.com/",' \
          '  "__internal__": { "migrations": { "version": "4.14.1" } }' \
          '}' > "$d/config.json"
      done
      echo P1_CONFIG_WRITTEN

  # ════════════════════════════════════════════════════════════════════════════
  # PHASE 2 — launch + verify login page (no Settings step)
  # ════════════════════════════════════════════════════════════════════════════

  - shell: |
      XAUTH=$(ls /run/user/1000/.mutter-Xwaylandauth.* 2>/dev/null | head -1)
      export DISPLAY=:0 XAUTHORITY="$XAUTH"
      nohup /opt/Rocket.Chat/rocketchat-desktop --no-sandbox --disable-gpu --ozone-platform=x11 >/dev/null 2>&1 &
      echo P2_APP_LAUNCHED

  - wait: 15

  - verify: |
      The Rocket.Chat application window shows the Workspace server login or
      authentication page, or connected Workspace content. It must NOT be the
      'Add a server' screen and must NOT be a crash dialog.
    verify_timeout: 30
    retries: 3

  # ════════════════════════════════════════════════════════════════════════════
  # PHASE 3 — link format dispatches
  # ════════════════════════════════════════════════════════════════════════════

  # ── F1: tel:+491234567890 ────────────────────────────────────────────────
  - shell: |
      export DISPLAY=:0
      nohup /opt/Rocket.Chat/rocketchat-desktop --no-sandbox "tel:+491234567890" >/dev/null 2>&1 &
      echo F1_DISPATCHED
  - wait: 5
  - verify: |
      The Rocket.Chat application window is visible and responsive after the
      tel:+491234567890 (E.164) dispatch. A dial pad showing the parsed digits
      may optionally be visible; either a healthy app window or a dial pad is
      acceptable. The app MUST NOT have crashed or shown an apport dialog.
    verify_timeout: 15
    retries: 3
  - wait: 3

  # ── F2: callto:+1-800-555-0199 ───────────────────────────────────────────
  - shell: |
      export DISPLAY=:0
      nohup /opt/Rocket.Chat/rocketchat-desktop --no-sandbox "callto:+1-800-555-0199" >/dev/null 2>&1 &
      echo F2_DISPATCHED
  - wait: 5
  - verify: |
      The Rocket.Chat application window is visible and responsive after the
      callto:+1-800-555-0199 (dashed) dispatch. A dial pad showing
      1-800-555-0199 or +18005550199 may optionally be visible; either a
      healthy app window or a dial pad is acceptable. App MUST NOT have crashed.
    verify_timeout: 15
    retries: 3
  - wait: 3

  # ── F3: callto://+491234567890 ────────────────────────────────────────────
  - shell: |
      export DISPLAY=:0
      nohup /opt/Rocket.Chat/rocketchat-desktop --no-sandbox "callto://+491234567890" >/dev/null 2>&1 &
      echo F3_DISPATCHED
  - wait: 5
  - verify: |
      The Rocket.Chat application window is visible and responsive after the
      callto://+491234567890 (authority/double-slash) dispatch. A dial pad with
      +491234567890 may optionally be visible; either a healthy app window or
      a dial pad is acceptable. Critical: the double-slash variant did not
      crash the links.ts parser.
    verify_timeout: 15
    retries: 3
  - wait: 3

  # ── F4: tel:(049) 123-456.78 ─────────────────────────────────────────────
  - shell: |
      export DISPLAY=:0
      nohup /opt/Rocket.Chat/rocketchat-desktop --no-sandbox "tel:(049) 123-456.78" >/dev/null 2>&1 &
      echo F4_DISPATCHED
  - wait: 5
  - verify: |
      The Rocket.Chat application window is visible and responsive after the
      tel:(049) 123-456.78 (parens+spaces+dots) dispatch. A dial pad with the
      extracted digits may optionally be visible; either a healthy app window
      or a dial pad is acceptable. Critical: unusual punctuation did not crash
      the parser.
    verify_timeout: 15
    retries: 3
  - wait: 3

  # ── F5: tel:+1-800-555-0199;ext=123 ──────────────────────────────────────
  - shell: |
      export DISPLAY=:0
      nohup /opt/Rocket.Chat/rocketchat-desktop --no-sandbox "tel:+1-800-555-0199;ext=123" >/dev/null 2>&1 &
      echo F5_DISPATCHED
  - wait: 5
  - verify: |
      The Rocket.Chat application window is visible and responsive after the
      tel:+1-800-555-0199;ext=123 (extension parameter) dispatch. A dial pad
      with +18005550199 or 1-800-555-0199 may optionally be visible; either a
      healthy app window or a dial pad is acceptable. Critical: the semicolon
      extension parameter did not crash the parser.
    verify_timeout: 15
    retries: 3
  - wait: 3

  # ── F6: tel:abc — malformed, no digits ───────────────────────────────────
  - shell: |
      export DISPLAY=:0
      nohup /opt/Rocket.Chat/rocketchat-desktop --no-sandbox "tel:abc" >/dev/null 2>&1 &
      echo F6_DISPATCHED
  - wait: 5
  - verify: |
      The Rocket.Chat application window is visible and responsive after the
      malformed tel:abc dispatch. The app may have silently ignored the link,
      opened an empty dial pad, or left the page unchanged — any of these is
      acceptable. Critical: NO crash dialog, NO apport handler, NO frozen
      window.
    verify_timeout: 15
    retries: 3

  # ════════════════════════════════════════════════════════════════════════════
  # PHASE 4 — aggregate alive check + cleanup
  # ════════════════════════════════════════════════════════════════════════════

  - wait: 3

  - verify: |
      The Rocket.Chat application window is visible and responsive after all
      six link format dispatches (E.164, callto dashed, callto double-slash,
      parens+dots, extension parameter, malformed). The app is alive with no
      crash dialog, no apport handler, no frozen window.
    verify_timeout: 15
    retries: 3

  - shell: |
      export DISPLAY=:0
      for attempt in 1 2 3 4 5 6; do
        pkill -TERM -f '/opt/Rocket.Chat' 2>/dev/null || true
        pkill -TERM -f 'rocketchat-desktop' 2>/dev/null || true
        pkill -TERM -f 'Rocket.Chat' 2>/dev/null || true
        sleep 1
        pgrep -af '(/opt/Rocket.Chat|rocketchat-desktop|Rocket.Chat)' >/dev/null 2>&1 || break
      done
      pkill -KILL -f '/opt/Rocket.Chat' 2>/dev/null || true
      pkill -KILL -f 'rocketchat-desktop' 2>/dev/null || true
      wmctrl -l 2>/dev/null | awk 'BEGIN{IGNORECASE=1} /Rocket.Chat|rocketchat|Problem in|apport|System program problem/ {print $1}' | while read -r wid; do
        wmctrl -i -c "$wid" 2>/dev/null || xdotool windowkill "$wid" 2>/dev/null || true
      done
      for d in "$HOME/.config/Rocket.Chat" "$HOME/.config/Rocket.Chat (development)"; do
        rm -rf "$d"
      done
      echo DONE
