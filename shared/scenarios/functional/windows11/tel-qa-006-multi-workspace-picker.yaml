# qa_flow: TEL-QA-006
# qa_source: qa/telephony-deeplink/flows/06-multi-workspace-picker.md
# Status: Windows 10 variant. Drafted 2026-05-23 by adapting
# `linux/tel-qa-006-multi-workspace-picker.yaml` for the windows10 VM.
#
# Mirrors the 6-step QA flow 1:1 (cross-platform spec):
#   1. Configure at least two workspaces → multiple choices available.
#   2. Click `tel:+15551234567` → Fuselage telephony server picker modal opens.
#   3. Review modal contents → each workspace row shows a readable title/host.
#   4. Click a workspace WITHOUT Remember checked → dialpad opens in selected ws.
#   5. Click another link (`callto://+491234567890`) → picker opens AGAIN
#      (Remember was unchecked so no preference was persisted).
#   6. Close/cancel the modal → no dial occurs; app remains alive.
#
# Windows-specific deviations from the linux variant:
#   * Per-OS routine resolver picks `shared/routines/windows/launch-rocketchat.yaml`
#     and `cleanup-rocketchat.yaml` automatically.
#   * Link dispatch uses `Start-Process 'tel:...'` (Windows protocol handler
#     invocation; equivalent to xdg-open / a browser click on test-links.html).
#   * userData lives under `$env:APPDATA\Rocket.Chat` (Roaming) — pre-stage
#     writes servers.json / config.json / overridden-settings.json there.
#   * AT-SPI absence-check worker call becomes a UIA worker call:
#     `python C:\tmp\mosdat_uia_worker.py "<json>"`. The UiaClient backend
#     transparently handles `atspi:` / `verify_atspi:` / `wait_for:` fields
#     so those step blocks are unchanged from the linux variant.
#   * Modal dismissal is via `key: Escape` (unchanged — handled by the
#     cross-platform injector).
#
# Live-discovered widget names (from linux variant header; same Fuselage
# build, same renderer — Windows UIA exposes the same role/name pairs):
#   - main frame:           role "frame" (any name)
#   - picker modal:         role "dialog" (Fuselage Modal portal, no name)
#   - remember checkbox:    role "check box", name "Remember for future calls"
#   - workspace row:        role "push button", name "<title> <hostname>"
#   - cancel button:        NOT in tree — modal dismisses via Escape key only

name: "tel-qa-006-multi-workspace-picker"
description: |
  TEL-QA-006 — Multi-workspace server picker (Windows 10).

  Smoke flow: With 3 workspaces configured and Telephony ENABLED but no
  remembered-choice preference, a phone-link dispatch (via Start-Process)
  must surface the server picker modal listing every workspace. The flow
  verifies:
    - picker opens on tel: dispatch (step 2)
    - each workspace row is readable (step 3)
    - selecting WITHOUT Remember dispatches the call AND does NOT persist
      the choice (step 4)
    - a second dispatch (callto: scheme this time) re-opens the picker
      (step 5)
    - the modal can be dismissed via Escape without placing a call (step 6)

vars:
  workspace_url: "https://rocketchat.jeanbrito.com"
  mobile_url: "https://mobile.rocket.chat"
  open_url: "https://open.rocket.chat"
  tel_link: "tel:+15551234567"
  callto_link: "callto://+491234567890"

steps:
  # ── Pre-test cleanup ─────────────────────────────────────────────────────
  - routine: cleanup-rocketchat

  # ── Pre-stage userData (3 workspaces + telephony ENABLED + NO remembered choice)
  - shell: |
        function _u($u) { if ($u.EndsWith('/')) { return $u } else { return $u + '/' } }
        $first  = _u '{{ workspace_url }}'
        $mobile = _u '{{ mobile_url }}'
        $open   = _u '{{ open_url }}'
        $dirs = @(
          "$env:APPDATA\Rocket.Chat",
          "$env:APPDATA\Rocket.Chat (development)"
        )
        foreach ($d in $dirs) {
          New-Item -ItemType Directory -Force -Path $d | Out-Null
          $serversJson = [ordered]@{
            'Workspace' = '{{ workspace_url }}'
            'Mobile RC' = '{{ mobile_url }}'
            'Open RC'   = '{{ open_url }}'
          } | ConvertTo-Json -Depth 4
          [System.IO.File]::WriteAllText("$d\servers.json", $serversJson, [System.Text.UTF8Encoding]::new($false))
          $config = [ordered]@{
            servers = @(
              @{ url = $first;  title = 'Workspace' },
              @{ url = $mobile; title = 'Mobile RC' },
              @{ url = $open;   title = 'Open RC'   }
            )
            currentView = @{ url = $first }
            rootWindowState = @{
              focused = $true; visible = $true; maximized = $false
              minimized = $false; fullscreen = $false; normal = $true
              bounds = @{ x = 40; y = 40; width = 1280; height = 820 }
            }
            lastSelectedServerUrl = $first
            __internal__ = @{ migrations = @{ version = '4.14.1' } }
          }
          $configJson = $config | ConvertTo-Json -Depth 8
          [System.IO.File]::WriteAllText("$d\config.json", $configJson, [System.Text.UTF8Encoding]::new($false))
          $overrides = [ordered]@{
            isTelephonyEnabled = $true
            telephonyPreferredServer = $null
            telephonyRememberChoice = $false
            telephonyGlobalShortcutConfig = @{ enabled = $false; accelerator = $null }
            isMenuBarEnabled = $true
            isSideBarEnabled = $true
            isTrayIconEnabled = $false
            isMinimizeOnCloseEnabled = $false
            doCheckForUpdatesOnStartup = $false
            isUpdatingEnabled = $false
          }
          $overridesJson = $overrides | ConvertTo-Json -Depth 8
          [System.IO.File]::WriteAllText("$d\overridden-settings.json", $overridesJson, [System.Text.UTF8Encoding]::new($false))
          foreach ($f in 'servers.json','config.json','overridden-settings.json') {
            $p = "$d\$f"
            $b = [System.IO.File]::ReadAllBytes($p)
            if ($b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF) {
              Write-Error "BOM detected in $p"; exit 1
            }
          }
        }
        Write-Host 'USERDATA_STAGED_3WORKSPACES_TELEPHONY_ON'

  # ── QA-006-step1: Launch Rocket.Chat via Windows routine ─────────────────
  - routine: launch-rocketchat

  - label: "QA-006-step1b: wait_for main window frame"
    wait_for: {any: [{role: "frame"}], timeout: 30}
    retries: 5

  # ── QA-006-step1c: Confirm ≥2 workspaces persisted ───────────────────────
  - label: "QA-006-step1c: assert servers.json has 3 workspaces"
    shell: |
        $dirs = @("$env:APPDATA\Rocket.Chat", "$env:APPDATA\Rocket.Chat (development)")
        foreach ($d in $dirs) {
          $p = Join-Path $d 'servers.json'
          if (-not (Test-Path $p)) { continue }
          $obj = Get-Content $p -Raw | ConvertFrom-Json
          $n = ($obj.PSObject.Properties | Measure-Object).Count
          if ($n -ge 2) { Write-Host "MULTI_WORKSPACE_OK ($n in $d)"; exit 0 }
        }
        Write-Error 'FAILED — servers.json contains fewer than 2 workspaces'
        exit 1

  # ── Pre-register RC as tel:/callto: OS default handler ───────────────────
  # Windows 10 1803+ validates UserChoice writes with a hash; direct
  # Set-ItemProperty writes succeed in PS but are silently rejected by the OS.
  # Instead: delete the stale UserChoice (if any) and register under
  # HKCU\Software\Classes, which the OS uses as fallback when UserChoice is
  # absent. This makes Start-Process tel:/callto: route to RC without the
  # Windows "How do you want to open this?" picker dialog.
  - label: "pre-stage: register RC as default tel:/callto: handler (HKCU\\Software\\Classes)"
    shell: |
        $rcExe = $null
        foreach ($c in @(
          "$env:LOCALAPPDATA\Programs\rocketchat-desktop\Rocket.Chat.exe",
          "$env:LOCALAPPDATA\Programs\Rocket.Chat\Rocket.Chat.exe",
          "C:\Program Files\Rocket.Chat\Rocket.Chat.exe"
        )) { if (Test-Path $c) { $rcExe = $c; break } }
        if (-not $rcExe) { Write-Error 'RC_EXE_NOT_FOUND_FOR_PROTOCOL_REG'; exit 1 }
        foreach ($scheme in @('tel','callto')) {
          $uc = "HKCU:\SOFTWARE\Microsoft\Windows\Shell\Associations\UrlAssociations\$scheme\UserChoice"
          if (Test-Path $uc) { Remove-Item -Path $uc -Force -Recurse -ErrorAction SilentlyContinue }
          $base = "HKCU:\Software\Classes\$scheme"
          New-Item -Path "$base\shell\open\command" -Force | Out-Null
          Set-ItemProperty -Path $base -Name '(Default)' -Value "URL:$scheme Protocol" -Force
          Set-ItemProperty -Path $base -Name 'URL Protocol' -Value '' -Force
          Set-ItemProperty -Path "$base\shell\open\command" -Name '(Default)' -Value "`"$rcExe`" `"%1`"" -Force
          Write-Host "${scheme}_HANDLER_REGISTERED"
        }
        Write-Host 'RC_PROTOCOL_HANDLER_PREREQ_DONE'

  # ══════════════════════════════════════════════════════════════════════════
  # QA-006-step2: Trigger tel:+15551234567 → picker modal opens
  # ══════════════════════════════════════════════════════════════════════════
  - label: "QA-006-step2a: dispatch tel: link (3-workspace picker should open)"
    shell: |
      powershell -Command "Start-Process '{{ tel_link }}'"
      echo TEL_DISPATCHED_1

  - label: "QA-006-step2b: wait_for picker modal (Fuselage dialog role)"
    wait_for: {any: [{role: "dialog"}], timeout: 30}
    retries: 5

  - label: "QA-006-step2c: verify_atspi picker dialog present"
    verify_atspi: {role: "dialog"}
    retries: 5

  - label: "QA-006-step2d: verify_atspi Remember for future calls checkbox"
    verify_atspi: {role: "check box", name: "Remember for future calls", name_substr: true}
    retries: 5

  - label: "QA-006-step2e: verify_atspi picker dialog still present"
    verify_atspi: {role: "dialog"}
    retries: 5

  # ══════════════════════════════════════════════════════════════════════════
  # QA-006-step3: Review modal contents — each workspace row is readable
  # ══════════════════════════════════════════════════════════════════════════
  - label: "QA-006-step3a: wait_for Workspace row in picker (rocketchat.jeanbrito.com)"
    wait_for: {any: [
      {role: "push button", name: "rocketchat.jeanbrito.com", name_substr: true}
    ], timeout: 15}
    retries: 5

  - label: "QA-006-step3b: wait_for Mobile RC row in picker (mobile.rocket.chat)"
    wait_for: {any: [
      {role: "push button", name: "mobile.rocket.chat", name_substr: true}
    ], timeout: 15}
    retries: 5

  - label: "QA-006-step3c: wait_for Open RC row in picker (open.rocket.chat)"
    wait_for: {any: [
      {role: "push button", name: "open.rocket.chat", name_substr: true}
    ], timeout: 15}
    retries: 5

  # ══════════════════════════════════════════════════════════════════════════
  # QA-006-step4: Click a workspace WITHOUT Remember → dialpad opens
  # ══════════════════════════════════════════════════════════════════════════
  - label: "QA-006-step4a: click Workspace row in picker (Remember UNCHECKED)"
    atspi: {role: "push button", name: "rocketchat.jeanbrito.com", name_substr: true}
    retries: 5

  - label: "QA-006-step4b: assert picker closed after row selection (Remember checkbox gone)"
    shell: |
        for ($i = 1; $i -le 10; $i++) {
          $probe = '{"ops":[{"id":"f","op":"find","role":"check box","name":"Remember for future calls","name_substr":true,"app_filter":"rocket"}]}'
          $res = & python C:\tmp\mosdat_uia_worker.py $probe 2>&1 | Out-String
          try {
            $d = $res | ConvertFrom-Json
            if (-not $d.results.f.ok) { Write-Host "PICKER_CLOSED_OK (attempt $i)"; exit 0 }
          } catch { }
          Start-Sleep -Seconds 1
        }
        Write-Error 'FAILED — picker still visible after workspace row click'
        exit 1

  - label: "QA-006-step4c: verify app alive (main frame visible)"
    verify_atspi: {role: "frame"}
    retries: 5

  # ══════════════════════════════════════════════════════════════════════════
  # QA-006-step5: Trigger another link (callto://) → picker opens AGAIN
  # ══════════════════════════════════════════════════════════════════════════
  - label: "QA-006-step5a: dispatch callto: link (picker must re-appear)"
    shell: |
      powershell -Command "Start-Process '{{ callto_link }}'"
      echo CALLTO_DISPATCHED_2

  - label: "QA-006-step5b: wait_for picker modal AGAIN (Remember was unchecked)"
    wait_for: {any: [{role: "check box", name: "Remember for future calls", name_substr: true}], timeout: 30}
    retries: 5

  - label: "QA-006-step5c: verify_atspi picker re-opened (dialog + checkbox present)"
    verify_atspi: {role: "check box", name: "Remember for future calls", name_substr: true}
    retries: 5

  # ══════════════════════════════════════════════════════════════════════════
  # QA-006-step6: Cancel the modal → no call placed; app remains alive
  # ══════════════════════════════════════════════════════════════════════════
  - label: "QA-006-step6a: dismiss picker via Escape key"
    key: Escape

  - wait: 1

  - label: "QA-006-step6b: assert picker dismissed (Remember checkbox gone)"
    shell: |
        for ($i = 1; $i -le 10; $i++) {
          $probe = '{"ops":[{"id":"f","op":"find","role":"check box","name":"Remember for future calls","name_substr":true,"app_filter":"rocket"}]}'
          $res = & python C:\tmp\mosdat_uia_worker.py $probe 2>&1 | Out-String
          try {
            $d = $res | ConvertFrom-Json
            if (-not $d.results.f.ok) { Write-Host "PICKER_DISMISSED_OK (attempt $i)"; exit 0 }
          } catch { }
          Start-Sleep -Seconds 1
        }
        Write-Error 'FAILED — Remember checkbox still present after Escape'
        exit 1

  # ── QA-006-step6c: Sanity — app still alive after cancel ─────────────────
  - label: "QA-006-step6c: verify_atspi main frame still present (no crash)"
    verify_atspi: {role: "frame"}
    retries: 5

  # ── Final cleanup ────────────────────────────────────────────────────────
  - routine: cleanup-rocketchat
