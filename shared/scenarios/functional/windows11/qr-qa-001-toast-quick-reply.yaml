  - label: "F0a: close Rocket.Chat before re-staging config for Track B"
    routine: cleanup-rocketchat

  # See E0b note — cleanup-rocketchat doesn't touch Edge; kept as an inline
  # standalone step rather than editing the shared routine. Section F is
  # exactly the section that regressed on this (step 71 mis-click opened
