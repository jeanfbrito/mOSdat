  # chat.getThreadMessages, then both cleaned up via chat.delete.
  - label: "F2: REST as {{ second_user }} — reply in-thread to the root message with an @{{ test_user }} mention (tmid set)"
    shell: |
        $ErrorActionPreference = 'Stop'
        try {
          $body = @{ user = '{{ second_user }}'; password = '{{ second_user_password }}' } | ConvertTo-Json
          $login = Invoke-RestMethod -Uri '{{ workspace_url }}/api/v1/login' -Method Post -ContentType 'application/json' -Body $body
          if (-not $login.data.authToken) { throw "REST login failed for second_user: $($login | ConvertTo-Json -Depth 5)" }
          $headers = @{ 'X-Auth-Token' = $login.data.authToken; 'X-User-Id' = $login.data.userId; 'Content-Type' = 'application/json' }

          $roomInfo = Invoke-RestMethod -Uri "{{ workspace_url }}/api/v1/channels.info?roomName={{ test_room }}" -Method Get -Headers $headers
          $roomId = $roomInfo.channel._id
          if (-not $roomInfo.success -or -not $roomId) { throw "channels.info failed to resolve roomId: $($roomInfo | ConvertTo-Json -Depth 5)" }

          $history = Invoke-RestMethod -Uri "{{ workspace_url }}/api/v1/channels.history?roomId=$roomId&count=5" -Method Get -Headers $headers
          if (-not $history.success) { throw "channels.history failed: $($history | ConvertTo-Json -Depth 5)" }
          $rootMsg = $history.messages | Where-Object { $_.msg -like '*{{ thread_root_prefix }}-{{ timestamp }}*' } | Select-Object -First 1
          if (-not $rootMsg) { throw "thread-root message not found in channels.history (looked for '*{{ thread_root_prefix }}-{{ timestamp }}*')" }
          $tmid = $rootMsg._id

          $sendBody = @{ message = @{ rid = $roomId; tmid = $tmid; msg = '@{{ test_user }} {{ thread_ping_prefix }}-{{ timestamp }}' } } | ConvertTo-Json -Depth 4
          $sendResp = Invoke-RestMethod -Uri '{{ workspace_url }}/api/v1/chat.sendMessage' -Method Post -Headers $headers -Body $sendBody
          if (-not $sendResp.success) { throw "chat.sendMessage failed: $($sendResp | ConvertTo-Json -Depth 5)" }
          Write-Host "THREAD_MENTION_POSTED tmid=$tmid"
        } catch {
          Write-Error "F2_FAILED: $_"
          exit 1
        }

  # ═══════════════════════════════════════════════════════════════════════
  # F4: reply to the thread-mention notification via the D-pattern
  # (Notification Center), not the live toast. Reworked 2026-08-21: live
  # SSH/live-run evidence (results/functional/2026-08-20_235614_functional/
  # windows10/001223_step77_click.png) shows the live-toast reply click
  # missing the target twice in a row (2/2 F failures) — the red click
  # marker landed in the wallpaper above the toast — while section D's
  # Notification Center pattern has passed 3/3 runs. Section F now waits
  # out the toast's auto-dismiss and replies from Notification Center
  # instead, reusing D5a/D5b's exact click-then-type shape.
  # ═══════════════════════════════════════════════════════════════════════
  - label: "F4a: wait past the default ~5-6s auto-dismiss window (default settings, no requireInteraction override)"
    wait: 8

  - label: "F4b: open Notification Center (Win+N on Windows 11)"
    key: "win+n"
    wait: 1

  - label: "F4c: verify Notification Center is open with the thread-mention notification card visible"
    verify: "the Windows Notification Center panel is open on the right side of the screen, showing a notification card from Rocket.Chat with the message preview text containing '#qa-room' and 'thread-ping'"
    verify_timeout: 10
    retries: 2

  - label: "F4d: click the empty reply input field on the Notification Center card"
    localize: "the empty text input field inside the Rocket.Chat notification, in the notification card showing '#qa-room' and 'thread-ping' text, inside the open Notification Center panel (around x=1055, y=241 on a 1280x800 screen)"
    click: "left"
    verify: "the reply input field inside the Rocket.Chat notification card in Notification Center is focused (shows a text cursor or highlighted border)"
    verify_timeout: 8
    retries: 2

  - wait: 1

  - label: "F4e: type the thread reply and send"
    then_type: "{{ thread_reply_prefix }}-{{ timestamp }}"
    then_key: "enter"

  - label: "F4f: close Notification Center"
    key: "escape"
    wait: 1

  - label: "F5: bring Rocket.Chat back to the foreground"
    key: "alt+tab"
    wait: 1

  # F6: open the thread panel — persistent surface, VLM verify appropriate
  # (not a hot path; kept per the coordinator's allowance).
  - label: "F6a: open {{ test_room }} if not already open"
    localize: "the '{{ test_room }}' channel entry in the left-hand channel sidebar"
    click: "left"
    verify: "the {{ test_room }} channel is open and its message list is visible"
    verify_timeout: 15
    retries: 3

  - label: "F6b: click the thread-root message's thread indicator / replies link to open the thread panel"
    localize: "the 'N replies' link or thread reply indicator below the message containing '{{ thread_root_prefix }}-{{ timestamp }}'"
    click: "left"
    verify: "a thread panel has opened, typically on the right side of the chat area, showing the thread-root message at the top"
    verify_timeout: 15
    retries: 3

  # Outcome assertion via REST — deterministic. Resolves the thread-root's
  # _id again (same lookup F2 used), then polls chat.getThreadMessages for
  # the reply AND cross-checks channels.history to confirm the reply did
  # NOT land as a flat main-channel message (the pre-fix #41875 regression).
  - label: "F7 [CORE PROOF PR#41875 — REST proof]: poll chat.getThreadMessages for the thread reply, and assert absence from the flat channel timeline"
    shell: |
        $ErrorActionPreference = 'Stop'
        try {
          $body = @{ user = '{{ second_user }}'; password = '{{ second_user_password }}' } | ConvertTo-Json
          $login = Invoke-RestMethod -Uri '{{ workspace_url }}/api/v1/login' -Method Post -ContentType 'application/json' -Body $body
          if (-not $login.data.authToken) { throw "REST login failed for second_user: $($login | ConvertTo-Json -Depth 5)" }
          $headers = @{ 'X-Auth-Token' = $login.data.authToken; 'X-User-Id' = $login.data.userId; 'Content-Type' = 'application/json' }

          $roomInfo = Invoke-RestMethod -Uri "{{ workspace_url }}/api/v1/channels.info?roomName={{ test_room }}" -Method Get -Headers $headers
          $roomId = $roomInfo.channel._id
          if (-not $roomInfo.success -or -not $roomId) { throw "channels.info failed to resolve roomId: $($roomInfo | ConvertTo-Json -Depth 5)" }

          $history = Invoke-RestMethod -Uri "{{ workspace_url }}/api/v1/channels.history?roomId=$roomId&count=10" -Method Get -Headers $headers
          if (-not $history.success) { throw "channels.history failed: $($history | ConvertTo-Json -Depth 5)" }
          $rootMsg = $history.messages | Where-Object { $_.msg -like '*{{ thread_root_prefix }}-{{ timestamp }}*' } | Select-Object -First 1
          if (-not $rootMsg) { throw "thread-root message not found in channels.history" }
          $tmid = $rootMsg._id

          $replyTarget = '{{ thread_reply_prefix }}-{{ timestamp }}'
          $foundInThread = $false
          for ($i = 0; $i -lt 8; $i++) {
            $threadMsgs = Invoke-RestMethod -Uri "{{ workspace_url }}/api/v1/chat.getThreadMessages?tmid=$tmid" -Method Get -Headers $headers
            if (-not $threadMsgs.success) { throw "chat.getThreadMessages failed: $($threadMsgs | ConvertTo-Json -Depth 5)" }
            $match = $threadMsgs.messages | Where-Object { $_.msg -like "*$replyTarget*" -and $_.tmid -eq $tmid } | Select-Object -First 1
            if ($match) { $foundInThread = $true; break }
            Start-Sleep -Seconds 2
          }
          if (-not $foundInThread) { throw "CORE PROOF FAILED: thread reply '$replyTarget' with tmid=$tmid never appeared in chat.getThreadMessages after polling" }

          # Absence check: the reply must NOT also appear as a flat, non-thread message.
          $historyAfter = Invoke-RestMethod -Uri "{{ workspace_url }}/api/v1/channels.history?roomId=$roomId&count=10" -Method Get -Headers $headers
          if (-not $historyAfter.success) { throw "channels.history (post-check) failed: $($historyAfter | ConvertTo-Json -Depth 5)" }
          $flatMatch = $historyAfter.messages | Where-Object { $_.msg -like "*$replyTarget*" -and -not $_.tmid } | Select-Object -First 1
          if ($flatMatch) { throw "CORE PROOF FAILED (#41875 regression reproduced): thread reply '$replyTarget' ALSO landed as a flat non-thread message in channels.history (id=$($flatMatch._id))" }

          Write-Host "THREAD_REPLY_CONFIRMED_IN_THREAD_ONLY: $replyTarget tmid=$tmid"
        } catch {
          Write-Error "F7_FAILED: $_"
          exit 1
        }

  # ── Final cleanup ────────────────────────────────────────────────────────
  - label: "G0: final cleanup"
    routine: cleanup-rocketchat
