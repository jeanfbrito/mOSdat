# qa_flow: TEL-QA-004
# qa_source: https://github.com/RocketChat/Rocket.Chat.Electron/blob/feat/telephony-deeplink/qa/telephony-deeplink/flows/04-diagnostics-panel.md
# Windows 10 variant. Adapted 2026-05-23 from
# shared/scenarios/functional/linux/3325-diagnostics-panel.yaml (renamed
# from 3325-* to tel-qa-004-* for QA mapping clarity).
#
# Mirrors the 6-step QA flow 1:1:
#   1. Navigate kebab → Settings → Voice & Video → find Telephony, enable it
#      → dismiss one-shot prompt → Diagnostics accordion is visible.
#   2. Expand Diagnostics.
#   3. Click Refresh → statuses update.
#   4. Click Copy → clipboard contains diagnostics JSON.
#   5. Review `isDefault.tel` and `isDefault.callto` keys in copied JSON.
#   6. If a row has "Open Settings", click it (Windows: ms-settings:defaultapps).
#
# Windows adaptations from linux source:
#   - Inline shell launch + XAUTH → `routine: launch-rocketchat`.
#   - Clipboard read: `xclip -o -selection clipboard` →
#     `Get-Clipboard -Raw` (PowerShell native).
#   - AT-SPI/UIA primitives unchanged; runner routes via UiaClient.
#   - `via: hint` on Fuselage ToggleSwitch — KEPT (UIA worker zero-extent walk).
#
# UI Variation note: clipboard format on Windows is identical (JSON text).
# The diagnostics JSON `platform` value will be `"win32"` vs Linux `"linux"`
# — this is expected and not asserted as a fixed value.

name: "tel-qa-004-diagnostics-panel"
description: |
  TEL-QA-004 — Telephony diagnostics panel (Windows 10).

  Pre-stages a workspace (telephony OFF), navigates kebab → Settings →
  Voice & Video, enables Telephony, dismisses the default-handler prompt,
  expands the Phone-link handler diagnostics accordion, clicks Refresh +
  Copy diagnostics, and asserts the clipboard JSON contains the expected
  keys (`isDefault.tel`, `isDefault.callto`, `platform`, `checks`).

vars:
  workspace_url: "https://rocketchat.jeanbrito.com"
  mobile_url: "https://mobile.rocket.chat"

steps:
  # ── Pre-test cleanup ─────────────────────────────────────────────────────
  - routine: cleanup-rocketchat

  # ── Pre-stage userData (servers + overridden-settings with telephony OFF) ─
  - shell: |
        $first = '{{ workspace_url }}'
        if (-not $first.EndsWith('/')) { $first += '/' }
        $mobile = '{{ mobile_url }}'
        if (-not $mobile.EndsWith('/')) { $mobile += '/' }
        $dirs = @("$env:APPDATA\Rocket.Chat", "$env:APPDATA\Rocket.Chat (development)")
        foreach ($d in $dirs) {
          New-Item -Path $d -ItemType Directory -Force | Out-Null
          $serversJson = @{ Workspace = '{{ workspace_url }}'; 'Mobile RC' = '{{ mobile_url }}' } | ConvertTo-Json
          [System.IO.File]::WriteAllText((Join-Path $d 'servers.json'), $serversJson, [System.Text.UTF8Encoding]::new($false))
          $config = @{
            servers = @(
              @{ url = $first;  title = 'Workspace' },
              @{ url = $mobile; title = 'Mobile RC' }
            )
            currentView = @{ url = $first }
            rootWindowState = @{
              focused = $true; visible = $true; maximized = $false;
              minimized = $false; fullscreen = $false; normal = $true;
              bounds = @{ x = 40; y = 40; width = 1280; height = 820 }
            }
            lastSelectedServerUrl = $first
            '__internal__' = @{ migrations = @{ version = '4.14.1' } }
          }
          $configJson = $config | ConvertTo-Json -Depth 6
          [System.IO.File]::WriteAllText((Join-Path $d 'config.json'), $configJson, [System.Text.UTF8Encoding]::new($false))
          $overrides = @{
            isTelephonyEnabled = $false
            telephonyPreferredServer = $null
            telephonyGlobalShortcutConfig = @{ enabled = $false; accelerator = $null }
            isMenuBarEnabled = $true
            isSideBarEnabled = $true
            isTrayIconEnabled = $false
            isMinimizeOnCloseEnabled = $false
            doCheckForUpdatesOnStartup = $false
            isUpdatingEnabled = $false
          }
          $overridesJson = $overrides | ConvertTo-Json -Depth 4
          [System.IO.File]::WriteAllText((Join-Path $d 'overridden-settings.json'), $overridesJson, [System.Text.UTF8Encoding]::new($false))
          foreach ($f in 'servers.json','config.json','overridden-settings.json') {
            $p = Join-Path $d $f
            $b = [System.IO.File]::ReadAllBytes($p)
            if ($b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF) {
              Write-Error "BOM detected in $p"; exit 1
            }
          }
        }
        Write-Host 'USERDATA_STAGED'

  # ── Launch RC via routine (resolves to windows/launch-rocketchat.yaml) ───
  - routine: launch-rocketchat

  # ── Wait for frame ───────────────────────────────────────────────────────
  - label: "wait_for RC frame to appear"
    wait_for: {any: [{role: "frame"}], timeout: 30}
    retries: 1

  # ── QA-004-step1: Navigate to Telephony settings ─────────────────────────
  - label: "QA-004-step1a: wait_for kebab button (workspace fully loaded)"
    wait_for: {any: [{role: "push button", name: "Customize and control app"}], timeout: 20}
    retries: 1

  - label: "QA-004-step1b: click kebab (Customize and control app)"
    atspi: {role: "push button", name: "Customize and control app"}
    retries: 1

  - label: "QA-004-step1c: wait_for Settings menu item"
    wait_for: {any: [{role: "menu item", name: "Settings"}], timeout: 10}
    retries: 1

  - label: "QA-004-step1d: click Settings menu item (UIA primary, VLM fallback)"
    atspi: {role: "menu item", name: "Settings"}
    localize: "the 'Settings' menu item text in the small popover near the bottom-left workspace sidebar, directly below the 'Downloads' row in the 'Customize and control app' popup"
    retries: 1

  - label: "QA-004-step1e: wait_for Settings General tab"
    wait_for: {any: [{role: "page tab", name: "General"}], timeout: 10}
    retries: 1

  - label: "QA-004-step1f: verify Voice & Video tab present (PR3325 diagnostics build)"
    verify_atspi: {role: "page tab", name: "Voice & Video"}
    retries: 1

  - label: "QA-004-step1g: click Voice & Video tab"
    atspi: {role: "page tab", name: "Voice & Video"}
    retries: 1

  - label: "QA-004-step1h: wait_for Telephony checkbox on Voice & Video tab"
    wait_for: {any: [{role: "check box", name: "Telephony"}], timeout: 10}
    retries: 1

  - wait: 1

  # ── Toggle Telephony ON (unlocks the Diagnostics panel render) ───────────
  # VLM-localize click — UIA _invoke_action fails on Fuselage ToggleSwitch.
  - label: "QA-004-step1i: click Telephony toggle via VLM (probe-by-modal)"
    localize: "the Telephony toggle switch in the Voice & Video Settings panel, to the right of the 'Telephony' label"
    click: "left"

  - wait: 1

  - label: "QA-004-step1j: wait_for Got it modal (confirms OFF→ON)"
    wait_for: {any: [{role: "push button", name: "Got it"}], timeout: 10}
    retries: 1

  - label: "QA-004-step1k: click Got it (dismiss default-handler prompt)"
    atspi: {role: "push button", name: "Got it"}
    retries: 1

  # ── QA-004-step2: Expand Diagnostics accordion ───────────────────────────
  - label: "QA-004-step2a: wait_for Phone-link handler diagnostics accordion"
    wait_for: {any: [{role: "push button", name: "Phone-link handler diagnostics", name_substr: true}], timeout: 10}
    retries: 1

  - label: "QA-004-step2b: expand Phone-link handler diagnostics accordion"
    atspi: {role: "push button", name: "Phone-link handler diagnostics", name_substr: true, via: "action"}
    retries: 1

  # ── QA-004-step3: Click Refresh ──────────────────────────────────────────
  - label: "QA-004-step3a: wait_for Refresh button (panel expanded)"
    wait_for: {any: [{role: "push button", name: "Refresh"}], timeout: 10}
    retries: 1

  - label: "QA-004-step3b: click Refresh in Diagnostics"
    atspi: {role: "push button", name: "Refresh", via: "action"}
    retries: 1

  - wait: 2

  # ── QA-004-step4: Click Copy diagnostics ─────────────────────────────────
  - label: "QA-004-step4: click Copy diagnostics (writes JSON to clipboard)"
    atspi: {role: "push button", name: "Copy diagnostics", via: "action"}
    retries: 1

  - wait: 1

  # ── QA-004-step5: Assert clipboard JSON contains diagnostics keys ────────
  # Windows clipboard read via PowerShell's Get-Clipboard. Same key set as
  # linux — isDefault.tel, isDefault.callto, platform, checks. The
  # `platform` value will be "win32" but we only assert key presence.
  - shell: |
        $clip = Get-Clipboard -Raw
        if (-not $clip) {
          Write-Error 'CLIPBOARD_EMPTY'
          exit 1
        }
        Write-Host ($clip.Substring(0, [Math]::Min(200, $clip.Length)))
        if ($clip -notmatch 'isDefault\.tel')    { Write-Error 'NO_ISDEFAULT_TEL_KEY';    exit 1 }
        if ($clip -notmatch 'isDefault\.callto') { Write-Error 'NO_ISDEFAULT_CALLTO_KEY'; exit 1 }
        if ($clip -notmatch '"platform"')       { Write-Error 'NO_PLATFORM_KEY';         exit 1 }
        if ($clip -notmatch '"checks"')         { Write-Error 'NO_CHECKS_KEY';           exit 1 }
        Write-Host 'DIAGNOSTICS_JSON_OK'

  # ── QA-004-step6: Activate per-row "Open Settings" if present ────────────
  # Spec step 6: "If a diagnostics row has a button labeled `Open Settings`,
  # click it." On Windows this opens ms-settings:defaultapps. Probe-by-find
  # because the button only renders for rows that map to an OS-settings
  # surface (currently the default-handler rows).
  - label: "QA-004-step6a: probe for per-row Open Settings button"
    shell: |
        $probe = '{"ops":[{"id":"f","op":"find","role":"push button","name":"Open Settings","app_filter":"rocket"}]}'
        $res = python C:\tmp\mosdat_uia_worker.py $probe 2>&1 | Out-String
        $obj = $res | ConvertFrom-Json
        if ($obj.results.f.ok) {
          Write-Host 'OPEN_SETTINGS_ROW_PRESENT'
        } else {
          Write-Host 'OPEN_SETTINGS_ROW_ABSENT (no per-row action in this build — step 6 skipped)'
        }

  - label: "QA-004-step6b: click per-row Open Settings if present"
    shell: |
        $probe = '{"ops":[{"id":"f","op":"find","role":"push button","name":"Open Settings","app_filter":"rocket"}]}'
        $res = python C:\tmp\mosdat_uia_worker.py $probe 2>&1 | Out-String
        $obj = $res | ConvertFrom-Json
        if (-not $obj.results.f.ok) {
          Write-Host 'OPEN_SETTINGS_ROW_SKIPPED (button absent)'
          exit 0
        }
        $click = '{"ops":[{"id":"c","op":"click","role":"push button","name":"Open Settings","app_filter":"rocket","via":"action"}]}'
        $cres = python C:\tmp\mosdat_uia_worker.py $click 2>&1 | Out-String
        Write-Host 'OPEN_SETTINGS_ROW_CLICK_RESULT:'
        Write-Host $cres
        $cobj = $cres | ConvertFrom-Json
        if ($cobj.results.c.ok) {
          Write-Host 'OPEN_SETTINGS_ROW_CLICKED_OK'
          exit 0
        }
        Write-Error 'FAIL — Open Settings row present but click failed'
        exit 1

  - wait: 2

  # ── Final cleanup ────────────────────────────────────────────────────────
  - routine: cleanup-rocketchat
