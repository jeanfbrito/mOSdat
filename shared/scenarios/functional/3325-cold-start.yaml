name: "Rocket.Chat Desktop — Cold-start tel: deep link (pre-staged Redux)"
# Covers PR https://github.com/RocketChat/Rocket.Chat.Electron/pull/3325 G6:
#   App-closed cold start — fully quit RC, dispatch tel:, RC launches + queues.
#
# Strategy: pre-stage isTelephonyEnabled directly in config.json. No Settings
# panel needed. The cold-start launch passes the URL as argv to a binary that
# already reads isTelephonyEnabled from PersistableValues on boot.
#
# PHASES:
#   1. Pre-stage isTelephonyEnabled=true + 2 servers + preferred=workspace.
#   2. Positive cold start: nohup binary "tel:+..." → wait 25 s → dial pad OK
#      OR queued (workspace page is also acceptable evidence of launch).
#   3. Kill RC, rewrite config with isTelephonyEnabled=false, dispatch tel:
#      cold → RC launches but ignores telephony (no dial pad, no modal).

steps:
  # ════════════════════════════════════════════════════════════════════════════
  # PHASE 1 — pre-stage telephony ON + ensure RC fully killed
  # ════════════════════════════════════════════════════════════════════════════

  - shell: |
      set -u
      if ! command -v wmctrl >/dev/null 2>&1 || ! command -v xclip >/dev/null 2>&1; then
        if command -v apt-get >/dev/null 2>&1; then
          sudo env DEBIAN_FRONTEND=noninteractive apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y wmctrl xclip
        fi
      fi
      export DISPLAY=:0
      export XAUTHORITY="${XAUTHORITY:-$(ls /run/user/1000/.mutter-Xwaylandauth.* 2>/dev/null | head -1)}"
      for attempt in 1 2 3 4 5 6 7 8; do
        pkill -TERM -f '/opt/Rocket.Chat' 2>/dev/null || true
        pkill -TERM -f 'rocketchat-desktop' 2>/dev/null || true
        pkill -TERM -f 'Rocket.Chat' 2>/dev/null || true
        sleep 1
        pgrep -af '(/opt/Rocket.Chat|rocketchat-desktop|Rocket.Chat)' >/dev/null 2>&1 || break
      done
      pkill -KILL -f '/opt/Rocket.Chat' 2>/dev/null || true
      pkill -KILL -f 'rocketchat-desktop' 2>/dev/null || true
      pkill -KILL -f 'Rocket.Chat' 2>/dev/null || true
      pkill -KILL -x apport-gtk 2>/dev/null || true
      wmctrl -l 2>/dev/null | awk 'BEGIN{IGNORECASE=1} /Rocket.Chat|rocketchat|Problem in|apport|System program problem/ {print $1}' | while read -r wid; do
        wmctrl -i -c "$wid" 2>/dev/null || xdotool windowkill "$wid" 2>/dev/null || true
      done
      for d in "$HOME/.config/Rocket.Chat" "$HOME/.config/Rocket.Chat (development)"; do
        rm -rf "$d"; mkdir -p "$d"
      done
      echo P1_CLEAN

  # ── P1b: Pre-stage telephony ON config with preferred=workspace ───────────
  # Setting telephonyPreferredServer skips the modal so the cold-start path
  # routes directly to the workspace dial pad.
  - shell: |
      set -u
      for d in "$HOME/.config/Rocket.Chat" "$HOME/.config/Rocket.Chat (development)"; do
        printf '%s\n' \
          '{' \
          '  "Workspace": "https://rocketchat.jeanbrito.com",' \
          '  "Mobile RC": "https://mobile.rocket.chat"' \
          '}' > "$d/servers.json"
        printf '%s\n' \
          '{' \
          '  "servers": [' \
          '    { "url": "https://rocketchat.jeanbrito.com/", "title": "Workspace" },' \
          '    { "url": "https://mobile.rocket.chat/", "title": "Mobile RC" }' \
          '  ],' \
          '  "currentView": { "url": "https://rocketchat.jeanbrito.com/" },' \
          '  "isTelephonyEnabled": true,' \
          '  "telephonyPreferredServer": "https://rocketchat.jeanbrito.com/",' \
          '  "telephonyGlobalShortcutConfig": { "enabled": false, "accelerator": null },' \
          '  "isMenuBarEnabled": true,' \
          '  "isSideBarEnabled": true,' \
          '  "isTrayIconEnabled": false,' \
          '  "isMinimizeOnCloseEnabled": false,' \
          '  "doCheckForUpdatesOnStartup": false,' \
          '  "isUpdatingEnabled": false,' \
          '  "rootWindowState": {' \
          '    "focused": true, "visible": true, "maximized": false, "minimized": false,' \
          '    "fullscreen": false, "normal": true,' \
          '    "bounds": { "x": 40, "y": 40, "width": 1280, "height": 820 }' \
          '  },' \
          '  "lastSelectedServerUrl": "https://rocketchat.jeanbrito.com/",' \
          '  "__internal__": { "migrations": { "version": "4.14.1" } }' \
          '}' > "$d/config.json"
      done
      echo P1_CONFIG_WRITTEN

  # ── P1c: Hard guard — zero RC processes before cold start ─────────────────
  - shell: |
      pgrep -af '(/opt/Rocket.Chat|rocketchat-desktop)' && { echo "RC STILL RUNNING — ABORT"; exit 1; } || echo P1_COLD_PRECONDITION_OK

  # ════════════════════════════════════════════════════════════════════════════
  # PHASE 2 — positive cold start
  # ════════════════════════════════════════════════════════════════════════════

  - shell: |
      XAUTH=$(ls /run/user/1000/.mutter-Xwaylandauth.* 2>/dev/null | head -1)
      export DISPLAY=:0 XAUTHORITY="$XAUTH"
      nohup /opt/Rocket.Chat/rocketchat-desktop --no-sandbox --disable-gpu --ozone-platform=x11 "tel:+5511999999999" >/dev/null 2>&1 &
      echo P2_COLD_DISPATCHED

  - wait: 25

  # Two valid outcomes:
  #   (a) Dial pad with +5511999999999 (immediate UI processing).
  #   (b) Workspace login page (deep link queued until UI ready).
  - verify: |
      The Rocket.Chat application window is visible and has completed its
      initial load. One of two states is acceptable:
        (1) A dial pad or phone dialer interface is visible with the phone
            number +5511999999999 pre-filled.
        (2) The Workspace server login or authentication page is shown
            (email field, password field, login button), indicating RC
            launched successfully and the number is queued until login
            completes.
      It MUST NOT show a crash dialog, apport handler, 'Add a server' screen,
      or blank/frozen window.
    verify_timeout: 30
    retries: 5

  - shell: |
      pgrep -af '(/opt/Rocket.Chat|rocketchat-desktop)' || { echo "RC PROCESS GONE — FAIL"; exit 1; }
      echo P2_PROCESS_ALIVE

  # ════════════════════════════════════════════════════════════════════════════
  # PHASE 3 — negative cold start: telephony OFF → tel: arg ignored
  # ════════════════════════════════════════════════════════════════════════════

  # ── P3a: Kill RC ─────────────────────────────────────────────────────────
  - shell: |
      export DISPLAY=:0
      for attempt in 1 2 3 4 5 6; do
        pkill -TERM -f '/opt/Rocket.Chat' 2>/dev/null || true
        pkill -TERM -f 'rocketchat-desktop' 2>/dev/null || true
        pkill -TERM -f 'Rocket.Chat' 2>/dev/null || true
        sleep 1
        pgrep -af '(/opt/Rocket.Chat|rocketchat-desktop|Rocket.Chat)' >/dev/null 2>&1 || break
      done
      pkill -KILL -f '/opt/Rocket.Chat' 2>/dev/null || true
      pkill -KILL -f 'rocketchat-desktop' 2>/dev/null || true
      pgrep -af '(/opt/Rocket.Chat|rocketchat-desktop)' && exit 1 || echo P3_KILLED

  # ── P3b: Rewrite config with isTelephonyEnabled=false ───────────────────
  - shell: |
      set -u
      for d in "$HOME/.config/Rocket.Chat" "$HOME/.config/Rocket.Chat (development)"; do
        printf '%s\n' \
          '{' \
          '  "servers": [' \
          '    { "url": "https://rocketchat.jeanbrito.com/", "title": "Workspace" },' \
          '    { "url": "https://mobile.rocket.chat/", "title": "Mobile RC" }' \
          '  ],' \
          '  "currentView": { "url": "https://rocketchat.jeanbrito.com/" },' \
          '  "isTelephonyEnabled": false,' \
          '  "telephonyPreferredServer": null,' \
          '  "telephonyGlobalShortcutConfig": { "enabled": false, "accelerator": null },' \
          '  "isMenuBarEnabled": true,' \
          '  "isSideBarEnabled": true,' \
          '  "isTrayIconEnabled": false,' \
          '  "isMinimizeOnCloseEnabled": false,' \
          '  "doCheckForUpdatesOnStartup": false,' \
          '  "isUpdatingEnabled": false,' \
          '  "rootWindowState": {' \
          '    "focused": true, "visible": true, "maximized": false, "minimized": false,' \
          '    "fullscreen": false, "normal": true,' \
          '    "bounds": { "x": 40, "y": 40, "width": 1280, "height": 820 }' \
          '  },' \
          '  "lastSelectedServerUrl": "https://rocketchat.jeanbrito.com/",' \
          '  "__internal__": { "migrations": { "version": "4.14.1" } }' \
          '}' > "$d/config.json"
      done
      echo P3_CONFIG_TELEPHONY_OFF

  # ── P3c: Dispatch tel: cold while toggle is OFF ───────────────────────────
  - shell: |
      XAUTH=$(ls /run/user/1000/.mutter-Xwaylandauth.* 2>/dev/null | head -1)
      export DISPLAY=:0 XAUTHORITY="$XAUTH"
      nohup /opt/Rocket.Chat/rocketchat-desktop --no-sandbox --disable-gpu --ozone-platform=x11 "tel:+5511999999999" >/dev/null 2>&1 &
      echo P3_COLD_DISPATCHED_TELEPHONY_OFF

  - wait: 25

  # KEY: RC launches but telephony is dormant — no dial pad, no modal.
  - verify: |
      The Rocket.Chat application window is visible after cold-start launch
      and shows a normal Workspace server login or authentication page (email
      field, password field, login button). There is NO dial pad, NO phone
      dialer interface, NO telephony server selection modal, and NO crash
      dialog. The app launched but ignored the tel: argument because
      isTelephonyEnabled is false in the persisted config.
    verify_not: |
      A telephony server selection modal listing 'Workspace' and 'Mobile RC'
      with a 'Remember this choice' checkbox is visible overlaying the
      Rocket.Chat window, OR a dial pad / phone dialer panel with a number
      input is visible.
    verify_timeout: 30
    retries: 5

  # ════════════════════════════════════════════════════════════════════════════
  # FINAL CLEANUP
  # ════════════════════════════════════════════════════════════════════════════
  - shell: |
      export DISPLAY=:0
      for attempt in 1 2 3 4 5 6; do
        pkill -TERM -f '/opt/Rocket.Chat' 2>/dev/null || true
        pkill -TERM -f 'rocketchat-desktop' 2>/dev/null || true
        pkill -TERM -f 'Rocket.Chat' 2>/dev/null || true
        sleep 1
        pgrep -af '(/opt/Rocket.Chat|rocketchat-desktop|Rocket.Chat)' >/dev/null 2>&1 || break
      done
      pkill -KILL -f '/opt/Rocket.Chat' 2>/dev/null || true
      pkill -KILL -f 'rocketchat-desktop' 2>/dev/null || true
      wmctrl -l 2>/dev/null | awk 'BEGIN{IGNORECASE=1} /Rocket.Chat|rocketchat|Problem in|apport|System program problem/ {print $1}' | while read -r wid; do
        wmctrl -i -c "$wid" 2>/dev/null || xdotool windowkill "$wid" 2>/dev/null || true
      done
      for d in "$HOME/.config/Rocket.Chat" "$HOME/.config/Rocket.Chat (development)"; do
        rm -rf "$d"
      done
      echo DONE
