name: "Rocket.Chat Desktop — Cold-start tel: deep link (G6)"
# Covers PR https://github.com/RocketChat/Rocket.Chat.Electron/pull/3325 G6:
#   App-closed cold start — fully quit RC, dispatch tel:, RC launches + queues.
#
# Strategy: pre-stage isTelephonyEnabled via overridden-settings.json using the
# launch-rocketchat routine. For the mid-scenario telephony-OFF flip, RC is killed
# and overridden-settings.json is rewritten directly (userData not wiped, so the
# 2-server config from Phase 1 remains). RC then cold-launches with the tel: argv
# but telephony is dormant — no dial pad, no modal.
#
# PHASES:
#   1. Pre-stage telephony ON via launch-rocketchat routine (writes overridden-settings.json
#      + config.json + servers.json); kill RC to achieve cold-start precondition.
#   2. Positive cold start: nohup binary "tel:+..." → wait 25 s → dial pad OK
#      OR login page (number queued until UI ready).
#   3. Kill RC, rewrite overridden-settings.json with isTelephonyEnabled=false,
#      dispatch tel: cold → RC launches but ignores telephony (no dial pad, no modal).

vars:
  workspace_url: "https://rocketchat.jeanbrito.com"
  mobile_url: "https://mobile.rocket.chat"

steps:
  # ════════════════════════════════════════════════════════════════════════════
  # PHASE 1 — pre-stage telephony ON + write overridden-settings.json
  # ════════════════════════════════════════════════════════════════════════════

  # ── P1a: clean slate ──────────────────────────────────────────────────────
  - routine: cleanup-rocketchat

  # ── P1b: write config.json + servers.json + overridden-settings.json ─────
  # telephony_enabled=true and preferred_server_url set so cold-start routes
  # directly to the workspace dial pad without showing the server-select modal.
  - routine:
      name: launch-rocketchat
      with:
        servers:
          - { title: "Workspace", url: "{{ workspace_url }}" }
          - { title: "Mobile RC", url: "{{ mobile_url }}" }
        telephony_enabled: true
        preferred_server_url: "{{ workspace_url }}/"

  # ── P1c: Kill the RC process launched by the routine — cold precondition ──
  - shell: |
      export DISPLAY=:0
      for attempt in 1 2 3 4 5 6; do
        pkill -TERM -f '/opt/Rocket.Chat' 2>/dev/null || true
        pkill -TERM -f 'rocketchat-desktop' 2>/dev/null || true
        pkill -TERM -f 'Rocket.Chat' 2>/dev/null || true
        sleep 1
        pgrep -af '(/opt/Rocket.Chat|rocketchat-desktop|Rocket.Chat)' >/dev/null 2>&1 || break
      done
      pkill -KILL -f '/opt/Rocket.Chat' 2>/dev/null || true
      pkill -KILL -f 'rocketchat-desktop' 2>/dev/null || true
      pgrep -af '(/opt/Rocket.Chat|rocketchat-desktop)' && { echo "RC STILL RUNNING — ABORT"; exit 1; } || echo P1_COLD_PRECONDITION_OK

  # ════════════════════════════════════════════════════════════════════════════
  # PHASE 2 — positive cold start
  # ════════════════════════════════════════════════════════════════════════════

  - shell: |
      XAUTH=$(ls /run/user/1000/.mutter-Xwaylandauth.* 2>/dev/null | head -1)
      export DISPLAY=:0 XAUTHORITY="$XAUTH"
      nohup /opt/Rocket.Chat/rocketchat-desktop --no-sandbox --disable-gpu --ozone-platform=x11 "tel:+5511999999999" >/dev/null 2>&1 &
      echo P2_COLD_DISPATCHED

  - wait: 25

  # Two valid outcomes:
  #   (a) Dial pad with +5511999999999 (immediate UI processing).
  #   (b) Workspace login page (deep link queued until UI ready).
  - verify: |
      The Rocket.Chat application window is visible and has completed its
      initial load. One of two states is acceptable:
        (1) A dial pad or phone dialer interface is visible with the phone
            number +5511999999999 pre-filled.
        (2) The Workspace server login or authentication page is shown
            (email field, password field, login button), indicating RC
            launched successfully and the number is queued until login
            completes.
      It MUST NOT show a crash dialog, apport handler, 'Add a server' screen,
      or blank/frozen window.
    verify_timeout: 30
    retries: 5

  - shell: |
      pgrep -af '(/opt/Rocket.Chat|rocketchat-desktop)' || { echo "RC PROCESS GONE — FAIL"; exit 1; }
      echo P2_PROCESS_ALIVE

  # ════════════════════════════════════════════════════════════════════════════
  # PHASE 3 — negative cold start: telephony OFF → tel: arg ignored
  # ════════════════════════════════════════════════════════════════════════════

  # ── P3a: Kill RC ──────────────────────────────────────────────────────────
  - shell: |
      export DISPLAY=:0
      for attempt in 1 2 3 4 5 6; do
        pkill -TERM -f '/opt/Rocket.Chat' 2>/dev/null || true
        pkill -TERM -f 'rocketchat-desktop' 2>/dev/null || true
        pkill -TERM -f 'Rocket.Chat' 2>/dev/null || true
        sleep 1
        pgrep -af '(/opt/Rocket.Chat|rocketchat-desktop|Rocket.Chat)' >/dev/null 2>&1 || break
      done
      pkill -KILL -f '/opt/Rocket.Chat' 2>/dev/null || true
      pkill -KILL -f 'rocketchat-desktop' 2>/dev/null || true
      pgrep -af '(/opt/Rocket.Chat|rocketchat-desktop)' && exit 1 || echo P3_KILLED

  # ── P3b: Flip telephony OFF via overridden-settings.json ─────────────────
  # Write directly while RC is dead. config.json + servers.json are left intact
  # (2-server config preserved from Phase 1). Only the feature flags change.
  # Using overridden-settings.json because RC Redux-persist silently ignores
  # top-level config.json writes. See docs/runbooks/scenario-state-seeding.md.
  - shell: |
      set -u
      for d in "$HOME/.config/Rocket.Chat" "$HOME/.config/Rocket.Chat (development)"; do
        cat > "$d/overridden-settings.json" <<'JSON'
      { "isTelephonyEnabled": false, "telephonyPreferredServer": null,
        "telephonyGlobalShortcutConfig": {"enabled": false, "accelerator": null},
        "isMenuBarEnabled": true, "isSideBarEnabled": true,
        "isTrayIconEnabled": false, "isMinimizeOnCloseEnabled": false,
        "doCheckForUpdatesOnStartup": false, "isUpdatingEnabled": false }
      JSON
      done
      echo P3_OVERRIDES_TELEPHONY_OFF

  # ── P3c: Dispatch tel: cold while telephony is OFF ────────────────────────
  - shell: |
      XAUTH=$(ls /run/user/1000/.mutter-Xwaylandauth.* 2>/dev/null | head -1)
      export DISPLAY=:0 XAUTHORITY="$XAUTH"
      nohup /opt/Rocket.Chat/rocketchat-desktop --no-sandbox --disable-gpu --ozone-platform=x11 "tel:+5511999999999" >/dev/null 2>&1 &
      echo P3_COLD_DISPATCHED_TELEPHONY_OFF

  - wait: 25

  # KEY: RC launches but telephony is dormant — no dial pad, no modal.
  - verify: |
      The Rocket.Chat application window is visible after cold-start launch
      and shows a normal Workspace server login or authentication page (email
      field, password field, login button). There is NO dial pad, NO phone
      dialer interface, NO telephony server selection modal, and NO crash
      dialog. The app launched but ignored the tel: argument because
      isTelephonyEnabled is false in overridden-settings.json.
    verify_not: |
      A telephony server selection modal listing 'Workspace' and 'Mobile RC'
      with a 'Remember this choice' checkbox is visible overlaying the
      Rocket.Chat window, OR a dial pad / phone dialer panel with a number
      input is visible.
    verify_timeout: 30
    retries: 5

  # ════════════════════════════════════════════════════════════════════════════
  # FINAL CLEANUP
  # ════════════════════════════════════════════════════════════════════════════
  - shell: |
      export DISPLAY=:0
      for attempt in 1 2 3 4 5 6; do
        pkill -TERM -f '/opt/Rocket.Chat' 2>/dev/null || true
        pkill -TERM -f 'rocketchat-desktop' 2>/dev/null || true
        pkill -TERM -f 'Rocket.Chat' 2>/dev/null || true
        sleep 1
        pgrep -af '(/opt/Rocket.Chat|rocketchat-desktop|Rocket.Chat)' >/dev/null 2>&1 || break
      done
      pkill -KILL -f '/opt/Rocket.Chat' 2>/dev/null || true
      pkill -KILL -f 'rocketchat-desktop' 2>/dev/null || true
      wmctrl -l 2>/dev/null | awk 'BEGIN{IGNORECASE=1} /Rocket.Chat|rocketchat|Problem in|apport|System program problem/ {print $1}' | while read -r wid; do
        wmctrl -i -c "$wid" 2>/dev/null || xdotool windowkill "$wid" 2>/dev/null || true
      done
      for d in "$HOME/.config/Rocket.Chat" "$HOME/.config/Rocket.Chat (development)"; do
        rm -rf "$d"
      done
      echo DONE
