# qa_flow: TEL-QA-014
# qa_source: https://github.com/RocketChat/Rocket.Chat.Electron/blob/feat/telephony-deeplink/qa/telephony-deeplink/flows/14-negative-cases.md
# Authored 2026-05-22 atop swiss-knife epic Stage 1+2+3 + pointer-mode default.
#
# Mirrors the 7-step QA flow 1:1:
#   1. Telephony DISABLED → click a valid tel: link → no call request placed
#      (protocol not bound to RC; no telephony surface in RC).
#   2. Fresh profile with zero workspaces → enable Telephony → click a tel:
#      link → no crash, no call placed (no workspaces means no dispatch).
#   3. Click empty `tel:` → no call request is placed (malformed input
#      gracefully rejected — no telephony surface paints).
#   4. Click `callto:?subject=empty` (query-only, no number) → no call
#      request is placed (malformed input rejected).
#   5. With multiple workspaces, trigger a link → server picker opens → press
#      Escape to cancel → no call request is placed; modal closes cleanly.
#   6. Trigger two phone links in quick succession → at most one modal opens
#      (duplicate IPC listener guard); app does not crash.
#   7. Stale remembered workspace (workspace removed but still referenced in
#      telephonyPreferredServer) → picker opens instead of silently failing.
#
# Canonical template: tel-qa-002-enable-disable-gating.yaml (state cycling +
#   protocol routing assertions, inline shell launch + XAUTH fallback chain,
#   AT-SPI pointer-mode default, via: hint for Fuselage ToggleSwitch).
#
# Existing reference: 3325-edge-cases.yaml covers some negative cases
# (rapid-fire, big-number formatting, callto: dispatch, .desktop MimeType).
# Proven idiom carried over: nohup + & xdg-open so xdg-open's exit code does
# not fail the step — the assertion is always on RC's AT-SPI surface.
#
# Live-discovered widget names (from TEL-QA-002, ubuntu2204@192.168.13.81):
#   - kebab:     push button "Customize and control app"
#   - settings:  menu item "Settings"
#   - tab:       page tab "Voice & Video"
#   - section:   check box "Telephony" inside Voice & Video
#   - prompt:    push button "Got it" (default-handler modal, OFF→ON one-shot)
#   - picker:    role "dialog" + check box "Remember for future calls"
#                + push button name_substr per workspace URL
#
# Absence-check pattern: shell to /tmp/mosdat_atspi_worker.py with
# {"ops":[{"op":"find",...}]} and assert results[id].ok == false. This is
# how we prove "no telephony surface painted" without a wait_for that
# would always succeed by timing out.
#
# AT-SPI/VLM ratio: 100% AT-SPI. No VLM fallback used.
# Per-step labels: "QA-014-stepN: ..." for log correlation.

name: "tel-qa-014-negative-cases"
description: |
  TEL-QA-014 — Negative and edge cases for tel:/callto: deeplinks.

  Disabled-state ignore → fresh-profile no-workspaces gating → malformed
  inputs (empty tel:, query-only callto:) gracefully rejected → cancel
  picker without dispatch → rapid-fire dedupe → stale remembered workspace
  recovery. Every assertion is AT-SPI based; no VLM.

vars:
  workspace_url: "https://rocketchat.jeanbrito.com"
  mobile_url: "https://mobile.rocket.chat"
  stale_url: "https://stale-removed.example.invalid"
  test_number: "+15551234567"
  test_number_b: "+15557654321"
  test_number_c: "+15550009999"

steps:
  # ═════════════════════════════════════════════════════════════════════════
  # PART 1 — Step 1: Telephony DISABLED → valid tel: link is ignored
  # ═════════════════════════════════════════════════════════════════════════

  - routine: cleanup-rocketchat

  # Pre-stage userData with two workspaces but Telephony OFF.
  - label: "QA-014-step1a: pre-stage userData (2 servers, telephony OFF)"
    shell: |
      set -u
      for d in "$HOME/.config/Rocket.Chat" "$HOME/.config/Rocket.Chat (development)"; do
        mkdir -p "$d"
        cat > "$d/servers.json" <<'JSON'
      {
        "Workspace": "{{ workspace_url }}",
        "Mobile RC": "{{ mobile_url }}"
      }
      JSON
        python3 - "$d" <<'PY'
      import json, sys, os
      d = sys.argv[1]
      first_url = "{{ workspace_url }}"
      if not first_url.endswith("/"):
          first_url += "/"
      mobile_url = "{{ mobile_url }}"
      if not mobile_url.endswith("/"):
          mobile_url += "/"
      config = {
          "servers": [
              {"url": first_url, "title": "Workspace"},
              {"url": mobile_url, "title": "Mobile RC"},
          ],
          "currentView": {"url": first_url},
          "rootWindowState": {
              "focused": True, "visible": True, "maximized": False,
              "minimized": False, "fullscreen": False, "normal": True,
              "bounds": {"x": 40, "y": 40, "width": 1280, "height": 820}
          },
          "lastSelectedServerUrl": first_url,
          "__internal__": {"migrations": {"version": "4.14.1"}}
      }
      open(os.path.join(d, "config.json"), "w").write(json.dumps(config, indent=2))
      overrides = {
          "isTelephonyEnabled": False,
          "telephonyPreferredServer": None,
          "telephonyGlobalShortcutConfig": {"enabled": False, "accelerator": None},
          "isMenuBarEnabled": True,
          "isSideBarEnabled": True,
          "isTrayIconEnabled": False,
          "isMinimizeOnCloseEnabled": False,
          "doCheckForUpdatesOnStartup": False,
          "isUpdatingEnabled": False,
      }
      open(os.path.join(d, "overridden-settings.json"), "w").write(
          json.dumps(overrides, indent=2))
      PY
      done
      echo USERDATA_STAGED_TEL_OFF

  - label: "QA-014-step1b: launch Rocket.Chat (telephony OFF pre-staged)"
    shell: |
      DESKTOP_ENV=$(mktemp)
      for pid in $(pgrep -u $(id -u) 'plasmashell|gnome-shell|kwin_x11|kwin_wayland' 2>/dev/null); do
        tr '\0' '\n' < /proc/$pid/environ 2>/dev/null | grep -E '^(DISPLAY|XAUTHORITY|DBUS_SESSION_BUS_ADDRESS|AT_SPI_BUS_ADDRESS)=' > "$DESKTOP_ENV"
        grep -q '^DISPLAY=' "$DESKTOP_ENV" && grep -q '^XAUTHORITY=' "$DESKTOP_ENV" && break
      done
      [ -s "$DESKTOP_ENV" ] && . "$DESKTOP_ENV"
      rm -f "$DESKTOP_ENV"
      XAUTH=${XAUTHORITY:-}
      [ -z "$XAUTH" ] && XAUTH=$(ls /run/user/$(id -u)/.mutter-Xwaylandauth.* /run/user/$(id -u)/xauth_* /run/user/$(id -u)/gdm/Xauthority "$HOME/.Xauthority" 2>/dev/null | head -1)
      export DISPLAY=${DISPLAY:-:0}
      [ -n "$XAUTH" ] && [ -f "$XAUTH" ] && export XAUTHORITY="$XAUTH"
      ACCESSIBILITY_ENABLED=1 nohup /opt/Rocket.Chat/rocketchat-desktop \
        --no-sandbox --disable-gpu --ozone-platform=x11 \
        --force-renderer-accessibility \
        >/dev/null 2>&1 &
      for i in $(seq 1 30); do
        if wmctrl -l 2>/dev/null | grep -q Rocket.Chat; then
          echo "window up after ${i}s"
          break
        fi
        sleep 1
      done

  - label: "QA-014-step1c: wait_for main window frame"
    wait_for: {any: [{role: "frame"}], timeout: 90, interval: 1.0}
    retries: 1

  - label: "QA-014-step1d: wait for workspace to fully load (kebab present)"
    wait_for: {any: [{role: "push button", name: "Customize and control app"}], timeout: 30}
    retries: 1

  - label: "QA-014-step1e: xdg-open valid tel:{{ test_number }} while Telephony OFF"
    shell: |
      DESKTOP_ENV=$(mktemp)
      for pid in $(pgrep -u $(id -u) 'plasmashell|gnome-shell|kwin_x11|kwin_wayland' 2>/dev/null); do
        tr '\0' '\n' < /proc/$pid/environ 2>/dev/null | grep -E '^(DISPLAY|XAUTHORITY|DBUS_SESSION_BUS_ADDRESS|AT_SPI_BUS_ADDRESS)=' > "$DESKTOP_ENV"
        grep -q '^DISPLAY=' "$DESKTOP_ENV" && grep -q '^XAUTHORITY=' "$DESKTOP_ENV" && break
      done
      [ -s "$DESKTOP_ENV" ] && . "$DESKTOP_ENV"
      rm -f "$DESKTOP_ENV"
      XAUTH=${XAUTHORITY:-}
      [ -z "$XAUTH" ] && XAUTH=$(ls /run/user/$(id -u)/.mutter-Xwaylandauth.* /run/user/$(id -u)/xauth_* /run/user/$(id -u)/gdm/Xauthority "$HOME/.Xauthority" 2>/dev/null | head -1)
      export DISPLAY=${DISPLAY:-:0}
      [ -n "$XAUTH" ] && [ -f "$XAUTH" ] && export XAUTHORITY="$XAUTH"
      nohup xdg-open 'tel:{{ test_number }}' >/dev/null 2>&1 &
      sleep 2
      echo "XDG_OPEN_DISPATCHED_TEL_OFF"

  - wait: 2

  - label: "QA-014-step1f: verify NO call request placed (no telephony surface)"
    shell: |
      set -u
      PROBE='{
        "ops": [
          {"id":"got_it","op":"find","role":"push button","name":"Got it","app_filter":"rocket"},
          {"id":"call_btn","op":"find","role":"dialog","app_filter":"rocket"},
          {"id":"remember","op":"find","role":"check box","name":"Remember for future calls","name_substr":true,"app_filter":"rocket"}
        ]
      }'
      RES=$(timeout 10s python3 /tmp/mosdat_atspi_worker.py "$PROBE" 2>&1 || true)
      ANY_PRESENT=$(echo "$RES" | python3 -c '
      import json, sys
      d = json.load(sys.stdin)
      r = d["results"]
      hits = [k for k in ("got_it","call_btn","remember") if r.get(k,{}).get("ok")]
      print(",".join(hits) if hits else "NONE")
      ' 2>/dev/null)
      if [ "$ANY_PRESENT" = "NONE" ]; then
        echo "STEP1_NO_CALL_PLACED_OK"
        exit 0
      fi
      echo "FAIL — telephony surface painted while telephony OFF: $ANY_PRESENT" >&2
      exit 1

  # Also assert app is alive (no crash dialog).
  - label: "QA-014-step1g: verify RC main frame still present (no crash)"
    verify_atspi: {role: "frame", app_filter: "rocket"}
    retries: 1

  # ═════════════════════════════════════════════════════════════════════════
  # PART 2 — Step 2: Fresh profile, ZERO workspaces, enable Telephony, click
  #          a phone link → no crash, no call placed.
  #
  # SKIPPED 2026-05-22 — upstream PR #3325 (feat/telephony-deeplink) crashes
  # on the fresh-zero-workspaces state before the main window appears.
  # Manual repro on ubuntu2204@192.168.13.81 (RC 4.14.1 PR build):
  #   TypeError: Cannot read properties of null (reading 'url')
  #     at setupServers (/opt/Rocket.Chat/resources/app.asar/app/main.js:6581:26)
  #     at /opt/Rocket.Chat/resources/app.asar/app/main.js:6583:55
  #     at select (.../main.js:2444:28)
  #     at start (.../main.js:13720:9)
  # setupServers calls select() on an empty servers array expecting at least
  # one element; iteration returns null → .url access throws. RC main process
  # exits silently; no window paints; 80s patience confirms the hang.
  #
  # This sub-scenario IS catching a real upstream regression in PR #3325. It
  # must be re-enabled once the PR fixes the zero-workspaces edge case.
  # See docs/KNOWN_ISSUES.md → "Rocket.Chat.Electron #3325 ... TypeError on
  # zero-workspaces fresh profile" for full context.
