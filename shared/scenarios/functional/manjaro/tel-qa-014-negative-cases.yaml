        sleep 1
      done

  - label: "QA-014-step3c: wait_for main window frame"
    wait_for: {any: [{role: "frame"}], timeout: 90, interval: 1.0}
    retries: 1

  - label: "Manjaro: pin tel/callto defaults before protocol negative cases"
    shell: |
      xdg-mime default rocketchat-desktop.desktop x-scheme-handler/tel
      xdg-mime default rocketchat-desktop.desktop x-scheme-handler/callto
      echo MANJARO_PROTOCOL_DEFAULTS_PINNED


  - label: "QA-014-step3d: wait for kebab present (workspace loaded)"
    wait_for: {any: [{role: "push button", name: "Customize and control app"}], timeout: 30}
    retries: 1

  # Empty tel: — scheme with no payload.
  - label: "QA-014-step3e: xdg-open empty 'tel:' (malformed)"
    shell: |
      DESKTOP_ENV=$(mktemp)
      for pid in $(pgrep -u $(id -u) 'plasmashell|gnome-shell|kwin_x11|kwin_wayland' 2>/dev/null); do
        tr '\0' '\n' < /proc/$pid/environ 2>/dev/null | grep -E '^(DISPLAY|XAUTHORITY|DBUS_SESSION_BUS_ADDRESS|AT_SPI_BUS_ADDRESS)=' > "$DESKTOP_ENV"
        grep -q '^DISPLAY=' "$DESKTOP_ENV" && grep -q '^XAUTHORITY=' "$DESKTOP_ENV" && break
      done
      [ -s "$DESKTOP_ENV" ] && . "$DESKTOP_ENV"
      rm -f "$DESKTOP_ENV"
      XAUTH=${XAUTHORITY:-}
      [ -z "$XAUTH" ] && XAUTH=$(ls /run/user/$(id -u)/.mutter-Xwaylandauth.* /run/user/$(id -u)/xauth_* /run/user/$(id -u)/gdm/Xauthority "$HOME/.Xauthority" 2>/dev/null | head -1)
      export DISPLAY=${DISPLAY:-:0}
      [ -n "$XAUTH" ] && [ -f "$XAUTH" ] && export XAUTHORITY="$XAUTH"
      nohup xdg-open 'tel:' >/dev/null 2>&1 &
      sleep 2
      echo "XDG_OPEN_TEL_EMPTY"

  - wait: 3

  - label: "QA-014-step3f: verify empty tel: rejected — no picker/dialpad painted"
    shell: |
      set -u
      PROBE='{
        "ops": [
          {"id":"remember","op":"find","role":"check box","name":"Remember for future calls","name_substr":true,"app_filter":"rocket"},
          {"id":"ws1","op":"find","role":"push button","name":"rocketchat","name_substr":true,"app_filter":"rocket"},
          {"id":"phone","op":"find","role":"entry","name":"phone","name_substr":true,"app_filter":"rocket"}
        ]
      }'
      RES=$(timeout 10s python3 /tmp/mosdat_atspi_worker.py "$PROBE" 2>&1 || true)
      ANY_PRESENT=$(echo "$RES" | python3 -c '
      import json, sys
      d = json.load(sys.stdin)
      r = d["results"]
      hits = [k for k in ("remember","ws1","phone") if r.get(k,{}).get("ok")]
      print(",".join(hits) if hits else "NONE")
      ' 2>/dev/null)
      if [ "$ANY_PRESENT" = "NONE" ]; then
        echo "STEP3_EMPTY_TEL_REJECTED_OK"
        exit 0
      fi
      echo "FAIL — empty tel: surfaced a telephony UI: $ANY_PRESENT" >&2
      exit 1

  - label: "QA-014-step3g: verify RC main frame still present (no crash)"
    verify_atspi: {role: "frame", app_filter: "rocket"}
    retries: 1

  # ═════════════════════════════════════════════════════════════════════════
  # PART 4 — Step 4: callto:?subject=empty (query-only, no number) rejected.
  # ═════════════════════════════════════════════════════════════════════════

  - label: "QA-014-step4a: xdg-open 'callto:?subject=empty' (query-only)"
    shell: |
      DESKTOP_ENV=$(mktemp)
      for pid in $(pgrep -u $(id -u) 'plasmashell|gnome-shell|kwin_x11|kwin_wayland' 2>/dev/null); do
        tr '\0' '\n' < /proc/$pid/environ 2>/dev/null | grep -E '^(DISPLAY|XAUTHORITY|DBUS_SESSION_BUS_ADDRESS|AT_SPI_BUS_ADDRESS)=' > "$DESKTOP_ENV"
        grep -q '^DISPLAY=' "$DESKTOP_ENV" && grep -q '^XAUTHORITY=' "$DESKTOP_ENV" && break
      done
      [ -s "$DESKTOP_ENV" ] && . "$DESKTOP_ENV"
      rm -f "$DESKTOP_ENV"
      XAUTH=${XAUTHORITY:-}
      [ -z "$XAUTH" ] && XAUTH=$(ls /run/user/$(id -u)/.mutter-Xwaylandauth.* /run/user/$(id -u)/xauth_* /run/user/$(id -u)/gdm/Xauthority "$HOME/.Xauthority" 2>/dev/null | head -1)
      export DISPLAY=${DISPLAY:-:0}
      [ -n "$XAUTH" ] && [ -f "$XAUTH" ] && export XAUTHORITY="$XAUTH"
      nohup xdg-open 'callto:?subject=empty' >/dev/null 2>&1 &
      sleep 2
      echo "XDG_OPEN_CALLTO_QUERY_ONLY"

  - wait: 3

  - label: "QA-014-step4b: verify query-only callto: rejected — no surface painted"
    shell: |
      set -u
      PROBE='{
        "ops": [
          {"id":"remember","op":"find","role":"check box","name":"Remember for future calls","name_substr":true,"app_filter":"rocket"},
          {"id":"ws1","op":"find","role":"push button","name":"rocketchat","name_substr":true,"app_filter":"rocket"},
          {"id":"phone","op":"find","role":"entry","name":"phone","name_substr":true,"app_filter":"rocket"}
        ]
      }'
      RES=$(timeout 10s python3 /tmp/mosdat_atspi_worker.py "$PROBE" 2>&1 || true)
      ANY_PRESENT=$(echo "$RES" | python3 -c '
      import json, sys
      d = json.load(sys.stdin)
      r = d["results"]
      hits = [k for k in ("remember","ws1","phone") if r.get(k,{}).get("ok")]
      print(",".join(hits) if hits else "NONE")
      ' 2>/dev/null)
      if [ "$ANY_PRESENT" = "NONE" ]; then
        echo "STEP4_QUERY_ONLY_CALLTO_REJECTED_OK"
        exit 0
      fi
      echo "FAIL — query-only callto: surfaced a telephony UI: $ANY_PRESENT" >&2
      exit 1

  - label: "QA-014-step4c: verify RC main frame still present (no crash)"
    verify_atspi: {role: "frame", app_filter: "rocket"}
    retries: 1

  # ═════════════════════════════════════════════════════════════════════════
  # PART 5 — Step 5: Multi-workspace picker opens, user CANCELS via Escape,
  #          no call is placed and modal closes cleanly.
  # ═════════════════════════════════════════════════════════════════════════

  - label: "QA-014-step5a: xdg-open tel:{{ test_number }} (should open picker)"
    shell: |
      DESKTOP_ENV=$(mktemp)
      for pid in $(pgrep -u $(id -u) 'plasmashell|gnome-shell|kwin_x11|kwin_wayland' 2>/dev/null); do
        tr '\0' '\n' < /proc/$pid/environ 2>/dev/null | grep -E '^(DISPLAY|XAUTHORITY|DBUS_SESSION_BUS_ADDRESS|AT_SPI_BUS_ADDRESS)=' > "$DESKTOP_ENV"
        grep -q '^DISPLAY=' "$DESKTOP_ENV" && grep -q '^XAUTHORITY=' "$DESKTOP_ENV" && break
      done
      [ -s "$DESKTOP_ENV" ] && . "$DESKTOP_ENV"
      rm -f "$DESKTOP_ENV"
      XAUTH=${XAUTHORITY:-}
      [ -z "$XAUTH" ] && XAUTH=$(ls /run/user/$(id -u)/.mutter-Xwaylandauth.* /run/user/$(id -u)/xauth_* /run/user/$(id -u)/gdm/Xauthority "$HOME/.Xauthority" 2>/dev/null | head -1)
      export DISPLAY=${DISPLAY:-:0}
      [ -n "$XAUTH" ] && [ -f "$XAUTH" ] && export XAUTHORITY="$XAUTH"
      nohup xdg-open 'tel:{{ test_number }}' >/dev/null 2>&1 &
      sleep 1
      echo "XDG_OPEN_TEL_MULTIWS"

  - label: "QA-014-step5b: wait_for server picker (any picker surface)"
    wait_for:
      any:
        - {role: "check box", name: "Remember for future calls", name_substr: true}
        - {role: "push button", name: "rocketchat.jeanbrito.com", name_substr: true}
        - {role: "push button", name: "mobile.rocket.chat", name_substr: true}
        - {role: "dialog"}
      timeout: 20
    retries: 1

  - label: "QA-014-step5c: cancel picker via Escape"
    key: Escape

  - wait: 1

  - label: "QA-014-step5d: verify picker dismissed (no Remember checkbox visible)"
    shell: |
      set -u
      PROBE='{
        "ops": [
          {"id":"remember","op":"find","role":"check box","name":"Remember for future calls","name_substr":true,"app_filter":"rocket"}
        ]
      }'
      RES=$(timeout 10s python3 /tmp/mosdat_atspi_worker.py "$PROBE" 2>&1 || true)
      if echo "$RES" | python3 -c 'import json,sys;d=json.load(sys.stdin);print("ABSENT" if not d["results"]["remember"]["ok"] else "PRESENT")' 2>/dev/null | grep -q ABSENT; then
        echo "STEP5_PICKER_DISMISSED_OK"
        exit 0
      fi
      echo "FAIL — Remember-for-future-calls still visible after Escape" >&2
      echo "$RES" >&2
      exit 1

  - label: "QA-014-step5e: verify RC main frame still present (no crash)"
    verify_atspi: {role: "frame", app_filter: "rocket"}
    retries: 1

  # ═════════════════════════════════════════════════════════════════════════
  # PART 6 — Step 6: Two phone links fired in quick succession. App must not
  #          duplicate modals or crash. Guard: duplicate IPC listener dedupe
  #          (ab816c0db). Allow at most ONE picker surface.
  # ═════════════════════════════════════════════════════════════════════════

  - label: "QA-014-step6a: rapid-fire two tel: links via xdg-open (background)"
    shell: |
      DESKTOP_ENV=$(mktemp)
      for pid in $(pgrep -u $(id -u) 'plasmashell|gnome-shell|kwin_x11|kwin_wayland' 2>/dev/null); do
        tr '\0' '\n' < /proc/$pid/environ 2>/dev/null | grep -E '^(DISPLAY|XAUTHORITY|DBUS_SESSION_BUS_ADDRESS|AT_SPI_BUS_ADDRESS)=' > "$DESKTOP_ENV"
        grep -q '^DISPLAY=' "$DESKTOP_ENV" && grep -q '^XAUTHORITY=' "$DESKTOP_ENV" && break
      done
      [ -s "$DESKTOP_ENV" ] && . "$DESKTOP_ENV"
      rm -f "$DESKTOP_ENV"
      XAUTH=${XAUTHORITY:-}
      [ -z "$XAUTH" ] && XAUTH=$(ls /run/user/$(id -u)/.mutter-Xwaylandauth.* /run/user/$(id -u)/xauth_* /run/user/$(id -u)/gdm/Xauthority "$HOME/.Xauthority" 2>/dev/null | head -1)
      export DISPLAY=${DISPLAY:-:0}
      [ -n "$XAUTH" ] && [ -f "$XAUTH" ] && export XAUTHORITY="$XAUTH"
      nohup xdg-open 'tel:{{ test_number }}' >/dev/null 2>&1 &
      nohup xdg-open 'tel:{{ test_number_b }}' >/dev/null 2>&1 &
      sleep 2
      echo "TEL_RAPID_FIRE_DISPATCHED"

  - label: "QA-014-step6b: wait_for picker surface (at least one)"
    wait_for:
      any:
        - {role: "check box", name: "Remember for future calls", name_substr: true}
        - {role: "push button", name: "rocketchat.jeanbrito.com", name_substr: true}
        - {role: "push button", name: "mobile.rocket.chat", name_substr: true}
        - {role: "dialog"}
      timeout: 20
    retries: 1

  - label: "QA-014-step6c: verify NO duplicate modal (at most ONE Remember checkbox)"
    shell: |
      set -u
      # findall not in worker grammar — fall back to counting via repeated find.
      # Probe distinct names that should each be unique in a single modal.
      PROBE='{
        "ops": [
          {"id":"remember","op":"find","role":"check box","name":"Remember for future calls","name_substr":true,"app_filter":"rocket"}
        ]
      }'
      RES=$(timeout 10s python3 /tmp/mosdat_atspi_worker.py "$PROBE" 2>&1 || true)
      OK=$(echo "$RES" | python3 -c 'import json,sys;d=json.load(sys.stdin);print("1" if d["results"]["remember"].get("ok") else "0")' 2>/dev/null)
      if [ "$OK" = "1" ]; then
        echo "STEP6_AT_LEAST_ONE_MODAL_OK"
      else
        echo "FAIL — no picker surface after rapid-fire dispatch" >&2
        exit 1
      fi
      # App-alive sanity.
      if pgrep -af '(/opt/Rocket.Chat|rocketchat-desktop)' >/dev/null 2>&1; then
        echo "STEP6_APP_ALIVE_OK"
      else
        echo "FAIL — RC process not running after rapid-fire" >&2
        exit 1
      fi

  - label: "QA-014-step6d: verify RC main frame still present (no crash)"
    verify_atspi: {role: "frame", app_filter: "rocket"}
    retries: 1

  - key: Escape
  - wait: 1
  - key: Escape
  - wait: 1

  # ═════════════════════════════════════════════════════════════════════════
  # PART 7 — Step 7: Stale remembered workspace. We pre-staged a preferred
  #          server URL pointing at a workspace that does NOT exist in the
  #          server list. Expected: picker opens (graceful fallback) instead
  #          of silently failing or routing somewhere unintended.
  # ═════════════════════════════════════════════════════════════════════════

  - routine: cleanup-rocketchat

  - label: "QA-014-step7a: pre-stage stale telephonyPreferredServer + 2 real servers"
    shell: |
      set -u
      for d in "$HOME/.config/Rocket.Chat" "$HOME/.config/Rocket.Chat (development)"; do
        mkdir -p "$d"
        cat > "$d/servers.json" <<'JSON'
      {
        "Workspace": "{{ workspace_url }}",
        "Mobile RC": "{{ mobile_url }}"
      }
      JSON
        python3 - "$d" <<'PY'
      import json, sys, os
      d = sys.argv[1]
      first_url = "{{ workspace_url }}"
      if not first_url.endswith("/"):
          first_url += "/"
      mobile_url = "{{ mobile_url }}"
      if not mobile_url.endswith("/"):
          mobile_url += "/"
      stale_url = "{{ stale_url }}"
      if not stale_url.endswith("/"):
          stale_url += "/"
      config = {
          "servers": [
              {"url": first_url, "title": "Workspace"},
              {"url": mobile_url, "title": "Mobile RC"},
          ],
          "currentView": {"url": first_url},
          "rootWindowState": {
              "focused": True, "visible": True, "maximized": False,
              "minimized": False, "fullscreen": False, "normal": True,
              "bounds": {"x": 40, "y": 40, "width": 1280, "height": 820}
          },
          "lastSelectedServerUrl": first_url,
          "__internal__": {"migrations": {"version": "4.14.1"}}
      }
      open(os.path.join(d, "config.json"), "w").write(json.dumps(config, indent=2))
      overrides = {
          "isTelephonyEnabled": True,
          # STALE: point preferred server at a URL not present in `servers`.
          "telephonyPreferredServer": stale_url,
          "telephonyGlobalShortcutConfig": {"enabled": False, "accelerator": None},
          "isMenuBarEnabled": True,
          "isSideBarEnabled": True,
          "isTrayIconEnabled": False,
          "isMinimizeOnCloseEnabled": False,
          "doCheckForUpdatesOnStartup": False,
          "isUpdatingEnabled": False,
      }
      open(os.path.join(d, "overridden-settings.json"), "w").write(
          json.dumps(overrides, indent=2))
      PY
      done
      echo STALE_PREFERRED_SERVER_STAGED

  - label: "QA-014-step7b: launch Rocket.Chat (stale preferred server)"
    shell: |
      DESKTOP_ENV=$(mktemp)
      for pid in $(pgrep -u $(id -u) 'plasmashell|gnome-shell|kwin_x11|kwin_wayland' 2>/dev/null); do
        tr '\0' '\n' < /proc/$pid/environ 2>/dev/null | grep -E '^(DISPLAY|XAUTHORITY|DBUS_SESSION_BUS_ADDRESS|AT_SPI_BUS_ADDRESS)=' > "$DESKTOP_ENV"
        grep -q '^DISPLAY=' "$DESKTOP_ENV" && grep -q '^XAUTHORITY=' "$DESKTOP_ENV" && break
      done
      [ -s "$DESKTOP_ENV" ] && . "$DESKTOP_ENV"
      rm -f "$DESKTOP_ENV"
      XAUTH=${XAUTHORITY:-}
      [ -z "$XAUTH" ] && XAUTH=$(ls /run/user/$(id -u)/.mutter-Xwaylandauth.* /run/user/$(id -u)/xauth_* /run/user/$(id -u)/gdm/Xauthority "$HOME/.Xauthority" 2>/dev/null | head -1)
      export DISPLAY=${DISPLAY:-:0}
      [ -n "$XAUTH" ] && [ -f "$XAUTH" ] && export XAUTHORITY="$XAUTH"
      ACCESSIBILITY_ENABLED=1 nohup /opt/Rocket.Chat/rocketchat-desktop \
        --no-sandbox --disable-gpu --ozone-platform=x11 \
        --force-renderer-accessibility \
        >/dev/null 2>&1 &
      for i in $(seq 1 30); do
        if wmctrl -l 2>/dev/null | grep -q Rocket.Chat; then
          echo "window up after ${i}s"
          break
        fi
        sleep 1
      done

  - label: "QA-014-step7c: wait_for main window frame"
    wait_for: {any: [{role: "frame"}], timeout: 90, interval: 1.0}
    retries: 1

  - label: "QA-014-step7d: wait for kebab present (workspace loaded)"
    wait_for: {any: [{role: "push button", name: "Customize and control app"}], timeout: 30}
    retries: 1

  - label: "QA-014-step7e: xdg-open tel:{{ test_number_c }} with stale preferred server"
    shell: |
      DESKTOP_ENV=$(mktemp)
      for pid in $(pgrep -u $(id -u) 'plasmashell|gnome-shell|kwin_x11|kwin_wayland' 2>/dev/null); do
        tr '\0' '\n' < /proc/$pid/environ 2>/dev/null | grep -E '^(DISPLAY|XAUTHORITY|DBUS_SESSION_BUS_ADDRESS|AT_SPI_BUS_ADDRESS)=' > "$DESKTOP_ENV"
        grep -q '^DISPLAY=' "$DESKTOP_ENV" && grep -q '^XAUTHORITY=' "$DESKTOP_ENV" && break
      done
      [ -s "$DESKTOP_ENV" ] && . "$DESKTOP_ENV"
      rm -f "$DESKTOP_ENV"
      XAUTH=${XAUTHORITY:-}
      [ -z "$XAUTH" ] && XAUTH=$(ls /run/user/$(id -u)/.mutter-Xwaylandauth.* /run/user/$(id -u)/xauth_* /run/user/$(id -u)/gdm/Xauthority "$HOME/.Xauthority" 2>/dev/null | head -1)
      export DISPLAY=${DISPLAY:-:0}
      [ -n "$XAUTH" ] && [ -f "$XAUTH" ] && export XAUTHORITY="$XAUTH"
      nohup xdg-open 'tel:{{ test_number_c }}' >/dev/null 2>&1 &
      sleep 1
      echo "XDG_OPEN_TEL_STALE_PREFERRED"

  # Expected: stale preferred is detected → picker opens with the REAL
  # workspaces. Silent failure (no picker, no dispatch) would also fail this.
  - label: "QA-014-step7f: wait_for picker to appear (graceful fallback)"
    wait_for:
      any:
        - {role: "check box", name: "Remember for future calls", name_substr: true}
        - {role: "push button", name: "rocketchat.jeanbrito.com", name_substr: true}
        - {role: "push button", name: "mobile.rocket.chat", name_substr: true}
        - {role: "dialog"}
      timeout: 20
    retries: 1

  - label: "QA-014-step7g: verify stale-URL workspace NOT offered as dispatch target"
    shell: |
      set -u
      PROBE='{
        "ops": [
          {"id":"stale","op":"find","role":"push button","name":"stale-removed.example.invalid","name_substr":true,"app_filter":"rocket"}
        ]
      }'
      RES=$(timeout 10s python3 /tmp/mosdat_atspi_worker.py "$PROBE" 2>&1 || true)
      if echo "$RES" | python3 -c 'import json,sys;d=json.load(sys.stdin);print("ABSENT" if not d["results"]["stale"]["ok"] else "PRESENT")' 2>/dev/null | grep -q ABSENT; then
        echo "STEP7_STALE_URL_NOT_OFFERED_OK"
        exit 0
      fi
      echo "FAIL — stale removed workspace surfaced as a dispatch target" >&2
      exit 1

  - label: "QA-014-step7h: verify RC main frame still present (no crash)"
    verify_atspi: {role: "frame", app_filter: "rocket"}
    retries: 1

  - key: Escape
  - wait: 1
  - key: Escape
  - wait: 1

  # ═════════════════════════════════════════════════════════════════════════
  # Final cleanup
  # ═════════════════════════════════════════════════════════════════════════
  - routine: cleanup-rocketchat
