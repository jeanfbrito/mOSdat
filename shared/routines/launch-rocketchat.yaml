name: launch-rocketchat
description: Write servers.json + config.json + overridden-settings.json to both userData dirs, then launch RC on X11 and wait for first paint
schema_version: v1
tags: [setup, launch, rocketchat]
# Why two files?
#   - config.json: state RC will read AND overwrite over its lifetime
#     (servers list, last view, window bounds). We seed it once; RC owns it after.
#   - overridden-settings.json: read-only force-overrides RC reads on every startup.
#     Use this for any boolean/string we need to GUARANTEE — toggles, feature flags,
#     update behavior. Documented in upstream README + src/app/main/data.ts.
#
#   The previous version of this routine tried to force-set isTelephonyEnabled
#   in config.json. That field is part of Redux-persist; on RC startup Redux
#   rehydrates from its own namespace and the top-level write is ignored.
#   Worse: if RC is not fully quit when we write, it overwrites the file on
#   the next state-save tick.
#
#   overridden-settings.json bypasses both problems.

inputs:
  servers:
    name: servers
    type: list
    required: true
  telephony_enabled:
    name: telephony_enabled
    type: bool
    required: false
    default: false
  preferred_server_url:
    name: preferred_server_url
    type: string
    required: false
    default: null
  shortcut_accelerator:
    name: shortcut_accelerator
    type: string
    required: false
    default: null
  migrations_version:
    name: migrations_version
    type: string
    required: false
    default: "4.14.1"

steps:
  - shell: |
      set -u
      SERVERS_JSON='{{ servers | tojson }}'
      FIRST_URL=$(python3 -c "import json,sys; s=json.loads(sys.argv[1]); print(s[0]['url'] if s else '')" "$SERVERS_JSON")
      SERVERS_KV=$(python3 -c "
      import json,sys
      s=json.loads(sys.argv[1])
      print(json.dumps({entry['title']: entry['url'] for entry in s}, indent=2))
      " "$SERVERS_JSON")
      SERVERS_ARR=$(python3 -c "
      import json,sys
      s=json.loads(sys.argv[1])
      out=[]
      for e in s:
          url=e['url']
          if not url.endswith('/'):
              url+='/'
          out.append({'url':url,'title':e['title']})
      print(json.dumps(out, indent=4))
      " "$SERVERS_JSON")
      LAST_URL=$(python3 -c "import json,sys; s=json.loads(sys.argv[1]); print(s[0]['url'] if s else '')" "$SERVERS_JSON")
      if [[ "$LAST_URL" != */ ]]; then LAST_URL="${LAST_URL}/"; fi
      FIRST_NORM=$(python3 -c "
      import json,sys
      s=json.loads(sys.argv[1])
      url=s[0]['url'] if s else ''
      print(url if url.endswith('/') else url+'/')
      " "$SERVERS_JSON")

      TEL_ENABLED='{{ telephony_enabled | tojson }}'
      PREF_SERVER='{{ preferred_server_url | tojson }}'
      ACCEL='{{ shortcut_accelerator | tojson }}'
      MIG_VER='{{ migrations_version }}'

      for d in "$HOME/.config/Rocket.Chat" "$HOME/.config/Rocket.Chat (development)"; do
        mkdir -p "$d"

        printf '%s\n' "$SERVERS_KV" > "$d/servers.json"

        python3 -c "
      import json, sys
      servers_arr = json.loads(sys.argv[1])
      first_url = sys.argv[2]
      mig_ver = sys.argv[3]

      # config.json: only state RC owns and may overwrite.
      # Do NOT put boolean feature flags here — RC Redux-persist rehydrates from
      # its own namespace and silently ignores top-level writes on every startup.
      # Use overridden-settings.json for any value we need to GUARANTEE.
      config = {
          'servers': servers_arr,
          'currentView': {'url': first_url},
          'rootWindowState': {
              'focused': True, 'visible': True, 'maximized': False,
              'minimized': False, 'fullscreen': False, 'normal': True,
              'bounds': {'x': 40, 'y': 40, 'width': 1280, 'height': 820}
          },
          'lastSelectedServerUrl': first_url,
          '__internal__': {'migrations': {'version': mig_ver}}
      }
      print(json.dumps(config, indent=2))
      " "$SERVERS_ARR" "$FIRST_NORM" "$MIG_VER" > "$d/config.json"

        python3 -c "
      import json, sys
      tel_enabled = sys.argv[1] == 'true'
      pref_server = None if sys.argv[2] == 'null' else sys.argv[2].strip('\"')
      accel_raw = sys.argv[3]
      accel = None if accel_raw == 'null' else accel_raw.strip('\"')

      # overridden-settings.json: RC merges this on top of Redux state on every startup.
      # Use this for any value we need to GUARANTEE regardless of prior Redux state.
      # Documented in upstream README + src/app/main/data.ts.
      overrides = {
          'isTelephonyEnabled': tel_enabled,
          'telephonyPreferredServer': pref_server,
          'telephonyGlobalShortcutConfig': {'enabled': accel is not None, 'accelerator': accel},
          'isMenuBarEnabled': True,
          'isSideBarEnabled': True,
          'isTrayIconEnabled': False,
          'isMinimizeOnCloseEnabled': False,
          'doCheckForUpdatesOnStartup': False,
          'isUpdatingEnabled': False,
      }
      print(json.dumps(overrides, indent=2))
      " "$TEL_ENABLED" "$PREF_SERVER" "$ACCEL" > "$d/overridden-settings.json"
      done
      echo LAUNCH_RC_CONFIG_WRITTEN

  - shell: |
      XAUTH=$(ls /run/user/1000/.mutter-Xwaylandauth.* 2>/dev/null | head -1)
      export DISPLAY=:0 XAUTHORITY="$XAUTH"
      nohup /opt/Rocket.Chat/rocketchat-desktop --no-sandbox --disable-gpu --ozone-platform=x11 >/dev/null 2>&1 &
      echo LAUNCH_RC_DONE

  - wait: 15

postconditions:
  - verify: "Rocket.Chat application window is visible — login page or workspace content, not 'Add a server' screen"
    verify_timeout: 30
    retries: 3
