# mosdat config for Rocket.Chat Electron
# Passwords: set MOSDAT_PROXMOX_PASSWORD and MOSDAT_VM_PASSWORD env vars (or use .env)

[app]
name = "rocketchat"
version = "4.12.0-alpha.2"
binary = "/opt/Rocket.Chat/rocketchat-desktop"
args = ["--no-sandbox"]
process_name = "rocketchat-desktop"
timeout = 10

[app.exit_codes]
pass = [0, 124]
fail = [139, 134]

[build]
repo_path = "/home/jean/projects/linux-testing/Rocket.Chat.Electron"
commands = [
    "yarn install",
    "yarn build",
    "yarn electron-builder --publish never --linux rpm deb AppImage snap",
]
dist_dir = "dist"
checkout = true

[proxmox]
host = "192.168.13.85"
port = 8006
user = "root@pam"
node = "pve"
gpu_pci_address = "0000:01:00"

[defaults]
user = "jean"

# --- VMs ---

[[vm]]
name = "fedora42"
vmid = 100
ip = "192.168.13.80"
desktop = "GNOME Wayland"

[[vm.package]]
format = "rpm"
install = "sudo dnf install -y /tmp/{file}"
uninstall = "sudo dnf remove -y {app_name} 2>/dev/null || true"
app_path = "/opt/Rocket.Chat/rocketchat-desktop"
file_glob = "rocketchat-*.rpm"

[[vm.package]]
format = "appimage"
install = "chmod +x /tmp/{file}"
uninstall = "rm -f /tmp/{file}"
app_path = "/tmp/{file}"
file_glob = "rocketchat-*-linux-x86_64.AppImage"

[[vm.package]]
format = "flatpak"
appid = "chat.rocket.RocketChat"
remote = "flathub"
install = "flatpak install --user --noninteractive --or-update flathub chat.rocket.RocketChat//{version}"
uninstall = "flatpak uninstall --user --noninteractive chat.rocket.RocketChat -y || true"
app_path = "flatpak run chat.rocket.RocketChat"
process_name = "rocketchat-desktop"
data_dir = "~/.var/app/chat.rocket.RocketChat"

