# --- VLM ---

[vlm]
# Crof.ai hosted VLM (model: greg). Bearer key read from file to avoid committing secrets.
base_url = "https://crof.ai/v1"
model = "greg"
verify_model = "greg"
expected_model = "greg"
api_key = "file:~/.shared/keys/crofai_api_key"
# greg is a reasoning model — burns 60-90 hidden CoT tokens before visible output.
# Floor every chat.completions.create at 1024 tokens so verify (default 64) doesn't truncate.
max_tokens_floor = 1024
# Local fallback (keep for offline runs — swap base_url/model back to use):
# base_url = "http://192.168.13.62:5001/v1"
# model = "qwen3.6-35b-a3b-apex-vl"
# max_tokens_floor = 0

# --- Functional Tests ---

[functional]
enabled = true
# Credentials are loaded from env vars (set in .env next to this config):
#   FUNCTIONAL_WORKSPACE_URL  — e.g. "chat.example.com"
#   FUNCTIONAL_TEST_USER      — e.g. "testuser"
#   FUNCTIONAL_TEST_PASSWORD  — e.g. "s3cr3t"
# Do NOT commit real credentials here.

# --- Report ---

[report]
title = "Rocket.Chat Electron - mOSdat Test Report"
critical_tests = ["wayland-fake"]
critical_description = "The wayland-fake test validates the Wayland crash fix (GitHub #3154). This test MUST pass on all configurations."

[report.known_issues]
"snap+gpu" = "Snap sandbox blocks GPU access"
"rpm+gpu-x11" = "RPM sandbox XAUTHORITY issue"

[cursor]
profile = "bezier"
duration_ms = 1000
hover_dwell_ms = 250
seed = "auto"
