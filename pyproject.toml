[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mosdat"
version = "0.2.0"
description = "Multi-OS Desktop App Testing with GPU passthrough"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "python-dotenv>=1.0",
    "requests>=2.28",
    "pillow>=10.0",
    "openai>=1.0",
    "pyyaml>=6.0",
    "websockets>=13.0",
    "pycryptodome>=3.20",
    "PyQt6>=6.6",
    "pydantic>=2.0",
    "jinja2>=3.0",
    "ruamel.yaml>=0.17",
]

[project.scripts]
mosdat = "automation.main:main"
mosdat-mcp = "automation.mcp_server:main"

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "mutmut"]
functional = ["pillow>=10.0", "openai>=1.0", "pyyaml>=6.0", "websockets>=13.0", "pycryptodome>=3.20"]

[tool.hatch.build.targets.wheel]
packages = ["automation"]

[tool.pytest.ini_options]
markers = [
    "live: tests that require a real VM (skipped without --live)",
    "issue: regression tests for tracked GitHub issues",
]
