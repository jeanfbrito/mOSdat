name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy — best effort)
        run: mypy automation/ || true

      - name: Audit dependencies for CVEs
        run: pip install pip-audit && pip-audit --requirement requirements-lock.txt --strict || true

      - name: Run unit tests
        run: pytest -q
