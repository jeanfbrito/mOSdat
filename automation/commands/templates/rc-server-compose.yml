services:
  mongo:
    image: mongodb/mongodb-community-server:8.0-ubi8
    # Rocket.Chat's own docker-compose-ci.yml overrides the entrypoint to wait
    # for mongod then explicitly run rs.initiate() — the base image's default
    # entrypoint does NOT do this on its own (verified live: without this,
    # mongo starts with --replSet but never gets a primary, and rocketchat
    # fails with MongoServerSelectionError / ReplicaSetNoPrimary).
    entrypoint: |
      bash -c
        "mongod --replSet rs0 --bind_ip_all &
          sleep 2;
          until mongosh --eval \"db.adminCommand('ping')\"; do
            echo '=====> Waiting for Mongo...';
            sleep 1;
          done;
          echo '=====> Initiating ReplSet rs0...';
          mongosh --eval \"rs.initiate({_id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }]})\";
          echo '=====> Initiating ReplSet done...';
        wait"
  rocketchat:
    image: ${RC_IMAGE}
    depends_on:
      - mongo
    environment:
      MONGO_URL: mongodb://mongo:27017/rocketchat?replicaSet=rs0
      ROOT_URL: ${ROOT_URL}
      PORT: "3000"
    ports:
      - "${HOST_PORT}:3000"
